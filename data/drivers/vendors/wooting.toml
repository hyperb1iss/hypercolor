[vendor]
name = "Wooting"
vid = [0x03EB, 0x31E3]
website = "https://wooting.io"
notes = "Per-key RGB built from Spec 90 and not yet run on Wooting hardware. Each 0x31E3 board also enumerates at base PID + 1 (DirectInput gamepad) and + 2 (no gamepad); all three are driven."

# ─── Keyboards on v1 firmware (Atmel VID) ────────────────────────────

[[devices]]
pid = 0xFF01
vid = 0x03EB
name = "Wooting One (v1 firmware)"
type = "keyboard"
status = "in_progress"
driver = "wooting"
transport = "usb_hid"
notes = "Original analog keyboard on 2017-2019 firmware. Four CRC-protected PWM reports per frame. Awaiting hardware confirmation."

[[devices]]
pid = 0xFF02
vid = 0x03EB
name = "Wooting Two (v1 firmware)"
type = "keyboard"
status = "in_progress"
driver = "wooting"
transport = "usb_hid"
notes = "Five CRC-protected PWM reports per frame, the fifth for the numpad. Awaiting hardware confirmation."

