[vendor]
name = "Twinkly"
vid = []
website = "https://twinkly.com"
notes = "Driven over the local REST API (login and verify handshake, gestalt, LED layout) and the real-time UDP frame protocol on port 7777, in datagram version 1, 2, or 3 by firmware. Discovered by the UDP discovery datagram on port 5555 or configured IPs; no account or pairing. Every LED is addressable, and the layout mapped in the Twinkly app becomes spatial positions. Experimental: tested against an in-repo fake device, not yet verified on real Twinkly hardware."

[[devices]]
name = "Twinkly Strings"
type = "strip"
status = "supported"
driver = "twinkly"
transport = "network_udp"
notes = "Generation I and II strings, RGB and RGBW, including Festoon, Cluster, and Icicle. LED count, profile, and firmware are read from the device. Experimental, unverified on hardware."

[[devices]]
name = "Twinkly Curtain and Wall"
type = "other"
status = "supported"
driver = "twinkly"
transport = "network_udp"
notes = "Parallel-string curtains such as the 210-LED RGBW Special Edition. The 2D layout from the Twinkly app sets each LED's position. Experimental, unverified on hardware."

[[devices]]
name = "Twinkly Squares"
type = "other"
status = "supported"
driver = "twinkly"
transport = "network_udp"
notes = "8x8 RGB panels, up to 16 per chain. Map the panels in the Twinkly app first so the layout carries their arrangement. Experimental, unverified on hardware."

[[devices]]
name = "Twinkly Flex and Line"
type = "strip"
status = "supported"
driver = "twinkly"
transport = "network_udp"
notes = "Flexible tubes and light lines, streamed per LED in wiring order or along the mapped layout. Experimental, unverified on hardware."

[[devices]]
name = "Twinkly Matrix and Tree"
type = "other"
status = "supported"
driver = "twinkly"
transport = "network_udp"
notes = "Matrix lights and pre-lit trees; 3D tree layouts are viewed from the front. Experimental, unverified on hardware."

[[devices]]
name = "Twinkly Gold Edition (AWW)"
type = "strip"
status = "known"
transport = "network_udp"
notes = "Amber, warm, and cold white LEDs (AWW profile). The per-LED byte order is undocumented, so these are skipped until it is."

[[devices]]
name = "Twinkly Pro controllers"
type = "argb_controller"
status = "known"
transport = "network_http"
notes = "Pro controllers speak a separate /xled/v2 API that the driver does not implement yet."
