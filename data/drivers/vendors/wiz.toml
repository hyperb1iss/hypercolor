[vendor]
name = "WiZ"
vid = []
website = "https://www.wizconnected.com"
notes = "Driven over the local WiZ UDP JSON API on port 38899: discovered by a registration broadcast or configured IPs, classified from the module name, and streamed one setPilot per frame. Every WiZ device is one color. Homes set to Only verified controls need the home signing key from the WiZ app. Experimental: tested against an in-repo fake device, not yet verified on real WiZ hardware."

