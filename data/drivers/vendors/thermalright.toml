[vendor]
name = "Thermalright"
vid = [0x0416]
website = "https://www.thermalright.com"
notes = "0x0416 is Winbond's vendor ID, shared with Lian Li hardware. Thermalright cooler LCDs report product string USBDISPLAY, and one product ID covers panels of several sizes; the handshake reply names the panel model."

# ─── Supported in Hypercolor ─────────────────────────────────────────

[[devices]]
pid = 0x5302
name = "Frozen Warframe LCD (320x240)"
type = "lcd"
status = "supported"
driver = "thermalright"
transport = "usb_hid"
notes = "Frozen Warframe 240, 360, and SE cooler LCDs and other 320x240 panels on this ID (panel models 49 to 53 and 58). RGB565 frames as 301 HID reports of 512 bytes, turned a quarter clockwise into a 240x320 raster, resent each second so the panel keeps the picture. Units on firmware 4.07 (bcdDevice 0x0407) are left unclaimed: the streaming Frozen Warframe SE on that release reboots on the handshake and wedges when reopened, and the release alone does not tell it apart from other panels. Spec 96."

# ─── Not Yet Supported ───────────────────────────────────────────────

[[devices]]
pid = 0x5302
name = "Trofeo Vision LCD (1280x480)"
type = "lcd"
status = "researched"
notes = "Same USB ID, panel model 128. Takes JPEG frames through the same header; the driver refuses this model until the JPEG path is built."

[[devices]]
pid = 0x5302
name = "Assassin Spirit 120 Vision (240x240)"
type = "lcd"
status = "researched"
notes = "Same USB ID, panel models 36 and 37. Unturned RGB565; the driver refuses these models until the square geometry is added."
