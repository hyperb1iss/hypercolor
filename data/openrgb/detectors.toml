# OpenRGB detector names owned by Hypercolor's native driver families.
#
# When the OpenRGB fallback bridge runs beside a native Hypercolor driver,
# both would claim the same USB or SMBus device. The managed OpenRGB config
# (Spec 81 §3.1) disables every OpenRGB detector whose name starts with one
# of the `prefixes` below for each native driver that is enabled and owns at
# least one enabled device. Matching is case-insensitive.
#
# `detectors` lists known OpenRGB detector names under each prefix so a fresh
# OpenRGB.json can be seeded before OpenRGB has ever written one. The list is
# a seed, not an inventory: prefixes do the real work, and any name OpenRGB
# already recorded in an existing OpenRGB.json is matched by prefix too.
#
# Every name below was verified against the Detectors.detectors map written
# by OpenRGB 1.0rc3 (hotfix 1). Families with no OpenRGB detector overlap are
# intentionally absent: prismrgb and push2 have no OpenRGB support; wled,
# hue, nanoleaf, and govee are configured through OpenRGB settings, not
# detectors; and QMK keyboards are config-driven in OpenRGB (per-device
# entries in settings), so no "QMK" detector name exists to disable.
#
# This file is embedded into hypercolor-openrgb-host with include_str!, so
# the binaries need no data file at runtime.

[[family]]
driver_id = "razer"
prefixes = ["Razer "]
detectors = [
  "Razer Base Station Chroma",
  "Razer Basilisk",
  "Razer Basilisk V3",
  "Razer Blackwidow Chroma",
  "Razer Blackwidow V3",
  "Razer Blackwidow V4",
  "Razer Charging Pad Chroma",
  "Razer Chroma Addressable RGB Controller",
  "Razer Chroma HDK",
  "Razer Core",
  "Razer Cynosa Chroma",
  "Razer Deathadder V2",
  "Razer Firefly",
  "Razer Goliathus",
  "Razer Huntsman",
  "Razer Huntsman V2",
  "Razer Kraken Kitty Edition",
  "Razer Laptop Stand Chroma",
  "Razer Mamba Elite",
  "Razer Mouse Bungee V3 Chroma",
  "Razer Mouse Dock Chroma",
  "Razer Naga Trinity",
  "Razer Nommo Chroma",
  "Razer Ornata Chroma",
  "Razer Seiren Emote",
  "Razer Strider Chroma",
  "Razer Tartarus V2",
]

