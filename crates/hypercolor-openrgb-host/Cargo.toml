[package]
name = "hypercolor-openrgb-host"
description = "OpenRGB host integration: binary detection, server probe, install hints, permissions, managed config"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
uuid = { workspace = true }
hypercolor-types = { workspace = true }
hypercolor-openrgb-sdk = { workspace = true }
hypercolor-persistence = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
win32job = "2.0.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }
nix = { version = "0.30.1", features = ["process", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
hypercolor-linux-session = { workspace = true }
