[package]
name = "hypercolor-macos-capture"
description = "ScreenCaptureKit acquisition and frame validation for Hypercolor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[features]
default = []
capture-fixtures = []

[dependencies]
thiserror = { workspace = true }

[[test]]
name = "capture_contract_tests"
path = "tests/capture_contract_tests.rs"
required-features = ["capture-fixtures"]
