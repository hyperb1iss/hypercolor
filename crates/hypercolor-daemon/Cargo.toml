[package]
name = "hypercolor-daemon"
description = "Daemon service for the Hypercolor RGB lighting engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hypercolor-daemon"
path = "src/main.rs"

[[test]]
name = "persistence_flush_tests"
required-features = ["persistence-test-hooks"]

[lints]
workspace = true

[features]
allocation-contract-tests = []
builtin-drivers = ["dep:hypercolor-driver-builtin", "hypercolor-driver-builtin/default"]
media-lottie = ["hypercolor-core/media-lottie"]
media-video = ["hypercolor-core/media-video"]
persistence-test-hooks = []
wgpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:hypercolor-windows-capture",
    "dep:hypercolor-windows-gpu-interop",
]
servo-gpu-import = ["servo", "wgpu", "hypercolor-core/servo-gpu-import"]
default = ["builtin-drivers", "wgpu", "servo", "servo-gpu-import"]
servo = ["hypercolor-core/servo"]

[dependencies]
hypercolor-types = { workspace = true }
hypercolor-core = { path = "../hypercolor-core", default-features = false }
hypercolor-platform-fs = { workspace = true }
hypercolor-driver-api = { workspace = true }
hypercolor-driver-builtin = { workspace = true, default-features = false, optional = true }
hypercolor-network = { workspace = true }
hypercolor-leptos-ext = { path = "../hypercolor-leptos-ext", default-features = false, features = ["ws-core", "axum"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
single-instance = "0.3.3"
socket2 = "0.6.3"
tokio = { workspace = true }
async-trait = { workspace = true }
spin_sleep = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rmcp = { workspace = true }
uuid = { workspace = true }
ulid = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
cpal = { workspace = true }
image = { workspace = true }
turbojpeg = { workspace = true }
fast_image_resize = { workspace = true }
tokio-util = { workspace = true }
if-addrs = { workspace = true }
mdns-sd = { workspace = true }
owo-colors = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
httpdate = "1.0"
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
hypercolor-windows-capture = { workspace = true, optional = true }
hypercolor-windows-gpu-interop = { workspace = true, features = ["screen-capture"], optional = true }
sysinfo = { workspace = true }
thread-priority = "3.0.0"
windows-service = "0.8.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
hypercolor-core = { path = "../hypercolor-core", default-features = false, features = ["windows-capture-fixtures"] }
hypercolor-windows-input = { path = "../hypercolor-windows-input" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
http = "1.2"
reqwest = { workspace = true }
criterion = { workspace = true }
gif = { workspace = true }
stats_alloc = { workspace = true }

[[test]]
name = "alloc_contract_tests"
path = "tests/alloc_contract_tests.rs"
required-features = ["allocation-contract-tests", "wgpu"]

[[bench]]
name = "render_pipeline"
harness = false
