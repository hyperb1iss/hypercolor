[package]
name = "hypercolor-windows-capture"
description = "Windows DXGI Desktop Duplication screen capture for Hypercolor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
capture-bench = []
capture-fixtures = []

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
image = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D11on12",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
] }

[[bench]]
name = "capture_reduction"
harness = false
required-features = ["capture-bench"]
