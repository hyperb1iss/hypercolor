[package]
name = "hypercolor-leptos-ext"
description = "In-tree Leptos and stream extension canary for Hypercolor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
ws-core = []
ws-client-wasm = [
    "ws-core",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "web-sys/BinaryType",
    "web-sys/CloseEvent",
    "web-sys/Event",
    "web-sys/MessageEvent",
    "web-sys/WebSocket",
]
events = [
    "dep:gloo-events",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/Event",
    "web-sys/EventTarget",
    "web-sys/FileList",
    "web-sys/HtmlInputElement",
    "web-sys/MessageEvent",
    "web-sys/ScrollBehavior",
    "web-sys/ScrollIntoViewOptions",
    "web-sys/ScrollLogicalPosition",
    "web-sys/Window",
    "web-sys/Worker",
]
canvas = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "web-sys/Blob",
    "web-sys/BlobPropertyBag",
    "web-sys/CanvasRenderingContext2d",
    "web-sys/Document",
    "web-sys/HtmlCanvasElement",
    "web-sys/ImageBitmap",
    "web-sys/ImageBitmapRenderingContext",
    "web-sys/ImageData",
    "web-sys/MessageEvent",
    "web-sys/OffscreenCanvas",
    "web-sys/Url",
    "web-sys/WebGlRenderingContext",
    "web-sys/Window",
]
raf = ["dep:wasm-bindgen", "dep:web-sys", "web-sys/Performance", "web-sys/Window"]
prelude = [
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "web-sys/Location",
    "web-sys/Performance",
    "web-sys/Storage",
    "web-sys/Window",
    "web-sys/console",
]
axum = ["ws-core", "dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
bytes = "1.11"
gloo-events = { version = "0.3", optional = true }
js-sys = { version = "0.3", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.9"
tokio = { workspace = true, features = ["macros", "rt", "time"] }
