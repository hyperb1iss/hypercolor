[package]
name = "hypercolor-driver-builtin"
description = "Built-in driver bundle for Hypercolor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["network", "hal", "serial"]
hal = ["dep:hypercolor-hal"]
network = ["govee", "hue", "lifx", "nanoleaf", "openrgb", "pixel", "twinkly", "wiz", "wled", "yeelight"]
serial = ["adalight"]
adalight = ["dep:hypercolor-driver-adalight"]
govee = ["dep:hypercolor-driver-govee"]
hue = ["dep:hypercolor-driver-hue"]
lifx = ["dep:hypercolor-driver-lifx"]
nanoleaf = ["dep:hypercolor-driver-nanoleaf"]
openrgb = ["dep:hypercolor-driver-openrgb"]
pixel = ["dep:hypercolor-driver-pixel"]
twinkly = ["dep:hypercolor-driver-twinkly"]
wiz = ["dep:hypercolor-driver-wiz"]
yeelight = ["dep:hypercolor-driver-yeelight"]
wled = ["dep:hypercolor-driver-wled"]

[dependencies]
hypercolor-core = { path = "../hypercolor-core", version = "0.9.0", default-features = false }
hypercolor-driver-adalight = { workspace = true, optional = true }
hypercolor-driver-api = { workspace = true }
hypercolor-driver-support = { workspace = true }
hypercolor-driver-govee = { workspace = true, optional = true }
hypercolor-driver-hue = { workspace = true, optional = true }
hypercolor-driver-lifx = { workspace = true, optional = true }
hypercolor-driver-nanoleaf = { workspace = true, optional = true }
hypercolor-driver-openrgb = { workspace = true, optional = true }
hypercolor-driver-pixel = { workspace = true, optional = true }
hypercolor-driver-twinkly = { workspace = true, optional = true }
hypercolor-driver-wiz = { workspace = true, optional = true }
hypercolor-driver-yeelight = { workspace = true, optional = true }
hypercolor-driver-wled = { workspace = true, optional = true }
hypercolor-hal = { workspace = true, optional = true }
hypercolor-network = { workspace = true }
hypercolor-types = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
