[package]
name = "hypercolor-core"
description = "Core engine for the Hypercolor RGB lighting orchestration system"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
allocation-contract-tests = []
spatial-workspace-test-hooks = []
windows-capture-fixtures = []
macos-native-fixtures = []
macos-capture-fixtures = ["hypercolor-macos-capture/capture-fixtures"]
media-lottie = ["dep:rlottie"]
media-video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
servo = [
    "dep:base",
    "dep:servo",
    "dep:profile_traits",
    "dep:dpi",
    "dep:gleam",
    "dep:raw-window-handle",
    "dep:tao",
]
servo-gpu-import = [
    "servo",
    "hypercolor-linux-gpu-interop?/servo-context",
    "hypercolor-macos-gpu-interop?/servo-context",
    "hypercolor-windows-gpu-interop?/servo-context",
    "dep:hypercolor-linux-gpu-interop",
    "dep:hypercolor-macos-gpu-interop",
    "dep:hypercolor-windows-gpu-interop",
    "dep:wgpu",
]

[dependencies]
hypercolor-color = { workspace = true }
hypercolor-types = { workspace = true }
# Unconditional: the shared event vocabulary and the decoding arithmetic
# compile everywhere, which is what lets Linux CI test the Windows key tables.
hypercolor-windows-input = { path = "../hypercolor-windows-input" }
# Unconditional: monitor selector parsing and persistence are platform-neutral;
# the capture crate supplies stubs when DXGI is unavailable.
hypercolor-windows-capture = { path = "../hypercolor-windows-capture" }
hypercolor-macos-input = { workspace = true }
hypercolor-macos-capture = { workspace = true }
hypercolor-driver-api = { workspace = true }
hypercolor-hal = { workspace = true }
hypercolor-platform-fs = { workspace = true }
hypercolor-worker-retention = { workspace = true }
hypercolor-linux-gpu-interop = { workspace = true, optional = true }
hypercolor-macos-gpu-interop = { workspace = true, optional = true }
hypercolor-windows-gpu-interop = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures-core = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
arc-swap = { workspace = true }
rayon = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }
sysinfo = { workspace = true }
mdns-sd = { workspace = true }
reqwest = { workspace = true }
url = "2.5.8"
nusb = { workspace = true }
realfft = { workspace = true }
rustfft = { workspace = true }
cpal = { workspace = true }
tokio-util = { workspace = true }
zerocopy = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
fast_image_resize = { workspace = true }
rlottie = { workspace = true, optional = true }
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
base = { workspace = true, optional = true }
profile_traits = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
dpi = { workspace = true, optional = true }
nvml-wrapper = { workspace = true }
servo = { workspace = true, features = ["baked-in-resources", "js_jit"], optional = true }
# Pinned to match servo-paint-api's `Rc<dyn gleam::gl::Gl>` so the direct
# glReadPixels path in servo/worker.rs can call into Servo's context.
gleam = { version = "0.15", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { workspace = true }
ashpd = { workspace = true }
pipewire = { workspace = true }
evdev = { workspace = true }
zbus = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
] }
servo = { workspace = true, features = ["baked-in-resources", "js_jit", "no-wgl"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
tao = { version = "0.34", default-features = false, features = ["rwh_06"], optional = true }
wmi = { workspace = true }
hypercolor-windows-pawnio = { path = "../hypercolor-windows-pawnio" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
log = "0.4"
criterion = { workspace = true }
gif = { workspace = true }
pollster = { workspace = true }
stats_alloc = { workspace = true }
trybuild = "1.0.120"

[[test]]
name = "alloc_contract_tests"
path = "tests/alloc_contract_tests.rs"
required-features = ["allocation-contract-tests"]

[[test]]
name = "screen_cpu_fanout_allocation_tests"
path = "tests/screen_cpu_fanout_allocation_tests.rs"
required-features = ["allocation-contract-tests"]

[[test]]
name = "media_input_allocation_tests"
path = "tests/media_input_allocation_tests.rs"
required-features = ["allocation-contract-tests"]

[[test]]
name = "spatial_area_reuse_tests"
path = "tests/spatial_area_reuse_tests.rs"
required-features = ["allocation-contract-tests"]

[[test]]
name = "macos_screen_capture_tests"
path = "tests/macos_screen_capture_tests.rs"
required-features = ["macos-capture-fixtures"]

[[bench]]
name = "core_pipeline"
harness = false
