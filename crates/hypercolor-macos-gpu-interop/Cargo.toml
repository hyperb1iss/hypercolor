[package]
name = "hypercolor-macos-gpu-interop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "macOS IOSurface/Metal texture import boundary for Hypercolor"

[features]
default = []
screen-capture = ["dep:hypercolor-macos-capture", "dep:objc2-core-video"]
servo-context = [
  "dep:cgl",
  "dep:dpi",
  "dep:euclid",
  "dep:gleam",
  "dep:glow",
  "dep:image",
  "dep:paint_api",
  "dep:surfman",
  "dep:tracing",
  "dep:webrender_api",
]

[dependencies]
hypercolor-gpu-frame = { workspace = true }
hypercolor-macos-capture = { workspace = true, optional = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cgl = { version = "0.3.2", optional = true }
dpi = { workspace = true, optional = true }
euclid = { version = "0.22", optional = true }
gleam = { version = "0.15", optional = true }
glow = { workspace = true, optional = true }
image = { workspace = true, optional = true }
libc = { workspace = true }
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { workspace = true, optional = true, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVMetalTexture",
  "CVMetalTextureCache",
  "CVPixelBuffer",
  "CVReturn",
  "objc2",
  "objc2-metal",
] }
objc2-io-surface = { workspace = true, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation", "libc", "bitflags"] }
objc2-metal = { workspace = true, features = [
  "std",
  "MTL4ArgumentTable",
  "MTL4CommandAllocator",
  "MTL4CommandBuffer",
  "MTL4CommitFeedback",
  "MTL4CommandEncoder",
  "MTL4CommandQueue",
  "MTL4ComputeCommandEncoder",
  "MTLAllocation",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLDevice",
  "MTLEvent",
  "MTLGPUAddress",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLResidencySet",
  "MTLResource",
  "MTLTexture",
  "MTLTypes",
  "objc2-io-surface",
] }
objc2-foundation = { workspace = true, features = ["std", "NSError", "NSString"] }
paint_api = { workspace = true, optional = true }
surfman = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
webrender_api = { workspace = true, optional = true }
wgpu-hal = { workspace = true, features = ["metal"] }

[dev-dependencies]
hypercolor-macos-capture = { workspace = true, features = ["capture-fixtures"] }
pollster = { workspace = true }

[[test]]
name = "servo_context_tests"
path = "tests/servo_context_tests.rs"
required-features = ["servo-context"]

[[test]]
name = "screen_capture_bridge_tests"
path = "tests/screen_capture_bridge_tests.rs"
required-features = ["screen-capture"]

[[example]]
name = "bench_macos_reduction"
path = "examples/bench_macos_reduction.rs"
required-features = ["screen-capture"]

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
