[workspace]
members = ["crates/*"]
exclude = ["crates/hypercolor-ui", "vendor/tachys"]
resolver = "3"

[workspace.package]
version = "0.6.1"
edition = "2024"
authors = ["Stefanie Jane <stef@hyperbliss.tech>"]
license = "Apache-2.0"
repository = "https://github.com/hyperb1iss/hypercolor"
homepage = "https://github.com/hyperb1iss/hypercolor"
rust-version = "1.94"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = 0 }
style = { level = "warn", priority = 1 }
perf = { level = "deny", priority = 1 }
pedantic = { level = "deny", priority = 10 }
missing_errors_doc = { level = "allow", priority = 20 }
missing_panics_doc = { level = "allow", priority = 20 }
missing_safety_doc = { level = "allow", priority = 20 }
module_name_repetitions = { level = "allow", priority = 21 }
significant_drop_tightening = { level = "allow", priority = 21 }
must_use_candidate = { level = "allow", priority = 21 }
implicit_hasher = { level = "allow", priority = 21 }
as_conversions = { level = "allow", priority = 22 }
bool_to_int_with_if = { level = "allow", priority = 22 }
bool_assert_comparison = { level = "allow", priority = 22 }
cast_possible_truncation = { level = "allow", priority = 22 }
cast_precision_loss = { level = "allow", priority = 22 }
cast_sign_loss = { level = "allow", priority = 22 }
comparison_chain = { level = "allow", priority = 22 }
doc_markdown = { level = "allow", priority = 22 }
float_cmp = { level = "allow", priority = 22 }
implicit_saturating_sub = { level = "allow", priority = 22 }
items_after_statements = { level = "allow", priority = 22 }
large_enum_variant = { level = "allow", priority = 22 }
map_unwrap_or = { level = "allow", priority = 22 }
needless_borrow = { level = "allow", priority = 22 }
option_as_ref_cloned = { level = "allow", priority = 22 }
question_mark = { level = "allow", priority = 22 }
similar_names = { level = "allow", priority = 22 }
struct_excessive_bools = { level = "allow", priority = 22 }
too_many_arguments = { level = "allow", priority = 22 }
too_many_lines = { level = "allow", priority = 22 }
uninlined_format_args = { level = "allow", priority = 22 }
unnested_or_patterns = { level = "allow", priority = 22 }
unused_self = { level = "allow", priority = 22 }
out_of_bounds_indexing = { level = "deny", priority = 30 }
enum_glob_use = { level = "deny", priority = 30 }
unwrap_used = { level = "deny", priority = 30 }
undocumented_unsafe_blocks = { level = "deny", priority = 30 }
dbg_macro = { level = "warn", priority = 31 }
todo = { level = "warn", priority = 31 }
manual_let_else = { level = "warn", priority = 36 }
redundant_else = { level = "warn", priority = 36 }
semicolon_if_nothing_returned = { level = "warn", priority = 36 }
cloned_instead_of_copied = { level = "warn", priority = 36 }
flat_map_option = { level = "warn", priority = 36 }
from_iter_instead_of_collect = { level = "warn", priority = 36 }
needless_pass_by_value = { level = "allow", priority = 36 }
trivially_copy_pass_by_ref = { level = "allow", priority = 36 }
if_not_else = { level = "warn", priority = 36 }
match_same_arms = { level = "allow", priority = 36 }
needless_continue = { level = "allow", priority = 36 }

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# jsonschema 0.49 enables serde_json/float_roundtrip globally.
# That feature changes f32 REST decoding before domain validation.
jsonschema = { version = "=0.49.9", default-features = false }
toml = "1.1"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1.53", features = ["full"] }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
spin_sleep = "1.3.3"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Data structures
crossbeam-queue = "0.3.14"
uuid = { version = "1.26", features = ["v4", "v5", "v7", "serde"] }
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
arc-swap = "1.9"
rayon = "1.12"
strum = { version = "0.28", features = ["derive"] }

# Config
dirs = "7.0"
notify = "8.2"
sysinfo = "0.38.4"
nvml-wrapper = "0.13.0"
# Pinned exactly: wmi 0.18.2+ declares open ranges (windows/windows-core
# ">=0.59, <0.63"), and with tao/wry holding windows-core at 0.61 the resolver
# pairs wmi with windows 0.62 + windows-core 0.61 — which doesn't compile
# (E0277 trait mismatches). 0.18.1 requires ^0.62 for both, forcing the
# consistent pair. Re-check the resolved pairing before unpinning.
wmi = "=0.18.4"

# Servo embedder boundary
# Servo's memory-report API exposes this callback type without reexporting it.
base = { package = "servo-base", version = "0.6.0" }
servo = { version = "0.6.0", default-features = false }
# servo-allocator 0.6 made jemalloc opt-in (use-jemalloc). Core's servo
# feature enables it on non-Windows targets so the daemon keeps jemalloc
# as its global allocator; the exact pin matches Servo's own pins.
servo-allocator = "=0.6.0"
surfman = "0.13"

# Crypto / auth
aes-gcm = "0.11.1"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }
keyring-core = "1.0.0"
rand = "0.10"
rand_core = { version = "0.10", features = ["getrandom"] }
webrtc-dtls = "0.12.0"
webrtc-util = "0.11.0"
windows-native-keyring-store = "1.1.0"

# Workspace crates
hypercolor-color = { path = "crates/hypercolor-color", version = "0.6.1" }
hypercolor-types = { path = "crates/hypercolor-types", version = "0.6.1" }
hypercolor-hal = { path = "crates/hypercolor-hal", version = "0.6.1" }
hypercolor-core = { path = "crates/hypercolor-core", version = "0.6.1" }
hypercolor-persistence = { path = "crates/hypercolor-persistence", version = "0.6.1" }
hypercolor-platform-fs = { path = "crates/hypercolor-platform-fs", version = "0.6.1" }
hypercolor-install = { path = "crates/hypercolor-install", version = "0.6.1" }
hypercolor-worker-retention = { path = "crates/hypercolor-worker-retention", version = "0.6.1" }
hypercolor-gpu-frame = { path = "crates/hypercolor-gpu-frame", version = "0.6.1" }
hypercolor-linux-input = { path = "crates/hypercolor-linux-input", version = "0.6.1" }
hypercolor-pipewire-interop = { path = "crates/hypercolor-pipewire-interop", version = "0.6.1" }
hypercolor-linux-session = { path = "crates/hypercolor-linux-session", version = "0.6.1" }
hypercolor-linux-gpu-interop = { path = "crates/hypercolor-linux-gpu-interop", version = "0.6.1" }
hypercolor-macos-gpu-interop = { path = "crates/hypercolor-macos-gpu-interop", version = "0.6.1" }
hypercolor-macos-capture = { path = "crates/hypercolor-macos-capture", version = "0.6.1" }
hypercolor-macos-input = { path = "crates/hypercolor-macos-input", version = "0.6.1" }
hypercolor-macos-owner = { path = "crates/hypercolor-macos-owner", version = "0.6.1" }
hypercolor-windows-session = { path = "crates/hypercolor-windows-session", version = "0.6.1" }
hypercolor-windows-capture = { path = "crates/hypercolor-windows-capture", version = "0.6.1" }
hypercolor-windows-gpu-interop = { path = "crates/hypercolor-windows-gpu-interop", version = "0.6.1" }
hypercolor-windows-telemetry = { path = "crates/hypercolor-windows-telemetry", version = "0.6.1" }
hypercolor-driver-api = { path = "crates/hypercolor-driver-api", version = "0.6.1" }
hypercolor-driver-support = { path = "crates/hypercolor-driver-support", version = "0.6.1" }
hypercolor-driver-builtin = { path = "crates/hypercolor-driver-builtin", version = "0.6.1", default-features = false }
hypercolor-driver-hue = { path = "crates/hypercolor-driver-hue", version = "0.6.1" }
hypercolor-driver-nanoleaf = { path = "crates/hypercolor-driver-nanoleaf", version = "0.6.1" }
hypercolor-driver-openrgb = { path = "crates/hypercolor-driver-openrgb", version = "0.6.1" }
hypercolor-driver-wled = { path = "crates/hypercolor-driver-wled", version = "0.6.1" }
hypercolor-driver-govee = { path = "crates/hypercolor-driver-govee", version = "0.6.1" }
hypercolor-network = { path = "crates/hypercolor-network", version = "0.6.1" }
hypercolor-openrgb-sdk = { path = "crates/hypercolor-openrgb-sdk", version = "0.6.1" }
hypercolor-openrgb-host = { path = "crates/hypercolor-openrgb-host", version = "0.6.1" }
hypercolor-tui = { path = "crates/hypercolor-tui", version = "0.6.1" }

# Audio + input capture
realfft = "3.5"
rustfft = "6.4"
cpal = "0.18.2"
libpulse-binding = "2.30.1"
evdev = "0.13.2"

# HTTP client
reqwest = { version = "0.13", features = ["json", "query"] }

# Zero-copy byte reinterpretation for wire-format protocol structs
zerocopy = { version = "0.8", features = ["derive"] }

# Network / device backends
if-addrs = "0.15.0"
mdns-sd = "0.21"
mach2 = "0.7"
nusb = { version = "0.2.7", features = ["tokio"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

# Screen capture
ash = "0.38"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
glow = "0.17"
libc = "0.2"
pipewire = "0.10.1"

# HTTP / API
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_path_order", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }

# CLI
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
clap_complete = "4.6"
owo-colors = "4"
unicode-width = "0.2.2"

# TUI
ratatui = "0.30"
crossterm = "0.29"
dpi = "0.1"
opaline = { version = "0.4", features = ["global-state", "owo-colors", "widgets", "discovery"] }
tachyonfx = "0.25"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
tokio-tungstenite = "0.30"
open = "5"

# Imaging
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
gif = "0.14.2"
rlottie = "0.5.4"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"] }
fast_image_resize = "6.1.0"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "metal", "dx12", "gles", "wgsl"] }
wgpu-hal = { version = "30.0.1", default-features = false, features = ["vulkan"] }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-io-surface = { version = "0.3.2", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }
objc2 = { version = "0.6.4", default-features = false }
pollster = "1.0.1"

# Testing
tempfile = "3.27"
criterion = { version = "0.8.2", features = ["html_reports"] }
stats_alloc = "0.1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep local development responsive without the massive runtime cliff of
# completely unoptimized Servo/canvas streaming in debug builds.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Keep Hypercolor crates debuggable, but treat third-party dependencies more
# like "runtime" code: optimize them, trim debug payload, and drop expensive
# safety instrumentation that mostly hurts hot render paths.
[profile.dev.package."*"]
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

# The daemon render path is hot even in local iteration, so give the core
# runtime a bit more help than the rest of the workspace.
[profile.dev.package.hypercolor-core]
opt-level = 2

[profile.dev.package.hypercolor-daemon]
opt-level = 2

[profile.dev.package.hypercolor-hal]
opt-level = 2

# Servo HTML effects spend most CPU time in software canvas rasterization
# (`vello_cpu` + SIMD helpers). Keep dev edit-compile loops fast while
# avoiding debug-profile runtime cliffs for live preview.
[profile.dev.package.servo]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.fearless_simd]
opt-level = 3

# JavaScript-heavy effects spend significant time in Servo's script pipeline.
[profile.dev.package.mozjs]
opt-level = 3

[profile.dev.package.mozjs_sys]
opt-level = 3

[profile.dev.package.servo-script]
opt-level = 3

[profile.dev.package.servo-script-bindings]
opt-level = 3

[profile.dev.package.servo-paint]
opt-level = 3

[profile.dev.package.servo-layout]
opt-level = 3

[profile.dev.package.webrender]
opt-level = 3

[profile.dev.package.webrender_api]
opt-level = 3

# Preview keeps the fast inner dev loop from `dev`, but disables the remaining
# runtime-heavy safety checks in Hypercolor crates so local daemon/UI runs feel
# much closer to release builds.
[profile.preview]
inherits = "dev"
debug-assertions = false
overflow-checks = false

[profile.preview.package."*"]
opt-level = 2
debug = false
debug-assertions = false
overflow-checks = false

# Preserve full symbols as an explicit opt-in without making every local test
# executable carry them by default.
[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"

[profile.preview.package.hypercolor-core]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.preview.package.hypercolor-daemon]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.preview.package.hypercolor-hal]
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.preview.package.servo]
opt-level = 3
debug = 0

[profile.preview.package.vello_cpu]
opt-level = 3
debug = 0

[profile.preview.package.vello_common]
opt-level = 3
debug = 0

[profile.preview.package.fearless_simd]
opt-level = 3
debug = 0

[profile.preview.package.mozjs]
opt-level = 3
debug = 0

[profile.preview.package.mozjs_sys]
opt-level = 3
debug = 0

[profile.preview.package.servo-script]
opt-level = 3
debug = 0

[profile.preview.package.servo-script-bindings]
opt-level = 3
debug = 0

[profile.preview.package.servo-paint]
opt-level = 3
debug = 0

[profile.preview.package.servo-layout]
opt-level = 3
debug = 0

[profile.preview.package.webrender]
opt-level = 3
debug = 0

[profile.preview.package.webrender_api]
opt-level = 3
debug = 0
