[advisories]
# vulnerability field removed in cargo-deny 0.18+ (all vulns are errors now)
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # crypto-bigint 0.5.5 has no patched release; the fix ships in 0.7.6.
    # It reaches us only through webrtc-dtls 0.12 (the latest) via
    # elliptic-curve 0.13, and the Hue driver restricts DTLS to
    # TLS_PSK_WITH_AES_128_GCM_SHA256, so no ECDHE or ECDSA arithmetic runs
    # on secrets. Drop this once webrtc-dtls moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via webrtc-dtls; Hue DTLS is PSK only" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    # jsonschema's URI parser uses this permissive MIT variant.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/hyperb1iss/surfman",
]
