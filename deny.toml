[advisories]
# vulnerability field removed in cargo-deny 0.18+ (all vulns are errors now)
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # crypto-bigint 0.5.5 has no patched release; the fix ships in 0.7.6.
    # It reaches us only through webrtc-dtls 0.12 (the latest) via
    # elliptic-curve 0.13, and the Hue driver restricts DTLS to
    # TLS_PSK_WITH_AES_128_GCM_SHA256, so no ECDHE or ECDSA arithmetic runs
    # on secrets. Drop this once webrtc-dtls moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via webrtc-dtls; Hue DTLS is PSK only" },
    # chrono is flagged unmaintained with no release to move to; the
    # advisory reports no vulnerability. Six workspace crates depend on it
    # directly and its timestamps are serialized in the shared API types,
    # so leaving it is a migration to jiff that has to keep that format
    # byte for byte, not a version bump. Drop this entry when that
    # migration lands.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no vulnerability; replacing it is a wire-format migration" },
    # cookie 0.16.2 reaches us only through Servo's webdriver 0.54, which
    # builds it with default features off. The repeating nonce lives in the
    # private cookie jar behind the "private" feature, so none of the
    # affected code is compiled. The 0.18 line is patched. Drop this once
    # Servo moves webdriver to cookie 0.18.
    { id = "RUSTSEC-2026-0594", reason = "cookie 0.16 via Servo webdriver, built without the private jar" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    # jsonschema's URI parser uses this permissive MIT variant.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
# Drivers reach HTTP through hypercolor-driver-support, whose read budget
# bounds every reply. Depending on reqwest directly reopens its unbounded
# readers, so a driver never joins this list.
deny = [
    { crate = "reqwest", wrappers = [
        "hypercolor",
        "hypercolor-app",
        "hypercolor-core",
        "hypercolor-daemon",
        "hypercolor-driver-support",
        "hypercolor-tui",
        "tauri",
    ] },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/hyperb1iss/surfman",
]
