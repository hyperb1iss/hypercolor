name: CI/CD

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_artifacts:
        description: "Build release artifacts without publishing a GitHub Release"
        required: false
        type: choice
        default: none
        options:
          - none
          - smoke
          - full
      release_version:
        description: "Dry-run semver for artifact names (blank = Cargo version + -ci.0)"
        required: false
      deploy_docs:
        description: "Deploy the current main docs site to GitHub Pages"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Tag runs publish, and a release is only ever cut from a commit main has
  # already proven green, so neither may be superseded. Cancelling main means
  # the next merge silently discards an hour of Windows and Servo work and
  # leaves the commit a release would ship with no verdict at all. Branch and
  # pull request runs stay cancellable, which is where the savings actually are.
  cancel-in-progress: >-
    ${{ !startsWith(github.ref, 'refs/tags/') &&
    github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_TOOLCHAIN: "1.99.0"
  XCODE_VERSION: "26.5"
  MACOSX_DEPLOYMENT_TARGET: "15.2"
  APT_STEP_TIMEOUT: 35m
  APT_HTTP_TIMEOUT: "20"
  APT_RETRIES: "5"
  # System deps shared across Linux jobs
  LINUX_DEPS: >-
    libudev-dev libdbus-1-dev libasound2-dev libpulse0
    libpipewire-0.3-dev
    ccache clang cmake jq nasm pkg-config lld
    libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev
    libxdo-dev
    libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
    librsvg2-dev libfontconfig1-dev libegl1 libssl-dev
  LINUX_RUST_DEPS: >-
    libudev-dev libdbus-1-dev libasound2-dev libpulse0
    libpipewire-0.3-dev
    ccache clang cmake jq nasm pkg-config lld ripgrep
    libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev
    libxdo-dev libfontconfig1-dev libegl1 libssl-dev
  # Servo and native app checks run separately so their feature/system deps do
  # not force unrelated crates onto the slow path.
  RUST_SHARED_WORKSPACE_ARGS: >-
    --workspace
    --exclude hypercolor-daemon
    --exclude hypercolor-app
  # Windows scope additionally drops the CLI, which depends on the daemon and
  # so drags in Servo and mozangle. Those need a Visual Studio developer
  # environment a bare runner does not have, and building them would tell us
  # nothing about the Windows-only code this job exists to gate.
  RUST_WINDOWS_WORKSPACE_ARGS: >-
    --workspace
    --exclude hypercolor-daemon
    --exclude hypercolor-app
    --exclude hypercolor
  HYPERCOLOR_CACHE_DIR: ${{ github.workspace }}/.cache/hypercolor
  # Tests resolve bundled effects next to the running executable unless this is
  # set, and CI invokes cargo directly instead of through the justfile that
  # normally exports it. Every job that stages generated effects puts them here.
  HYPERCOLOR_EFFECTS_DIR: ${{ github.workspace }}/effects/hypercolor
  CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target
  MOZBUILD_STATE_PATH: ${{ github.workspace }}/.cache/hypercolor/mozbuild
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  # ── Change Detection ───────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # True for anything that is not a pull request, which is deliberately
      # broad: it gates the expensive Servo test and doc-test steps so pull
      # requests get the light pass and main and tags get the heavy one. It is
      # NOT a stand-in for "release build", and it must not gate whole jobs —
      # the per-domain outputs below already force true for tags and non-smoke
      # dispatch, so they cover release on their own.
      full: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.release_artifacts != 'smoke')) }}
      rust: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.rust }}
      python: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.python }}
      python_generated: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.python_generated }}
      sdk: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.sdk }}
      ui: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.ui }}
      compat: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke') && 'false' || (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_artifacts != 'smoke')) && 'true' || steps.filter.outputs.compat }}
      docs: ${{ steps.filter.outputs.docs }}
      nix: ${{ steps.filter.outputs.nix }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'e2e/**'
              - 'protocol/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'scripts/cargo-cache-build.*'
              - 'scripts/cargo-cache-cargo-shim.sh'
              - 'scripts/cargo-target-gc.sh'
              - 'scripts/check-macos-gpu-only.sh'
              - 'scripts/tests/cargo-cache-build-tests.sh'
              - 'scripts/tests/cargo-cache-mode-tests.ps1'
              - 'scripts/tests/cargo-target-gc-tests.sh'
              - 'scripts/dist.sh'
              - 'scripts/verify-release-artifact.sh'
              - 'scripts/get-hypercolor.sh'
              - 'scripts/install-release.sh'
              - 'scripts/tests/release-artifact-tests.sh'
              - 'scripts/tests/docker-smoke.mjs'
              - 'scripts/tests/docker-workflow.test.mjs'
              - 'scripts/homebrew-formula.mjs'
              - 'scripts/tests/homebrew-formula.test.mjs'
              - 'packaging/**'
              - 'udev/**'
              - 'scripts/sign-macos-artifacts.sh'
              - 'scripts/macos-signing-keychain.c'
              - 'scripts/build-mac-installer.sh'
              - 'scripts/tests/macos-signing-secret-transport-tests.sh'
              - 'packaging/systemd/user/hypercolor-cargo-target-gc.*'
              - 'justfile'
              - '.github/actions/rust-build-cache/**'
              - '.github/workflows/ci.yml'
              # Decides whether Windows sees LF or CRLF, which changes what
              # include_str! embeds and what those tests can match.
              - '.gitattributes'
              # Embedded with include_str! and asserted on by the HAL tests.
              - 'data/drivers/**'
              # Embedded with include_str! by hypercolor-color's vector tests.
              # Without this the Rust half of the cross-language color fence
              # skips a pull request that only edits the shared table.
              - 'sdk/shared/color-vectors.json'
            python:
              - 'python/**'
              - 'protocol/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            python_generated:
              - 'python/scripts/generate_openapi_client.py'
              - 'python/scripts/generate_ws_protocol.py'
              - 'python/src/hypercolor/_generated/**'
              - 'python/src/hypercolor/ws_protocol.py'
              - 'python/pyproject.toml'
              - 'python/uv.lock'
              - 'protocol/**'
              - '.github/workflows/ci.yml'
            sdk:
              - 'sdk/**'
              - 'protocol/**'
              - 'crates/hypercolor-core/src/effect/lightscript/frame_payload_adapter.js'
              - 'justfile'
              - '.github/actions/bun-cache/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'packaging/docker/**'
              - 'scripts/tests/docker-smoke.mjs'
              - 'scripts/tests/docker-workflow.test.mjs'
              - 'crates/hypercolor-ui/**'
              - 'crates/hypercolor-leptos-ext/**'
              - 'protocol/**'
              - 'justfile'
              - '.github/actions/bun-cache/**'
              - '.github/actions/rust-build-cache/**'
              - '.github/workflows/ci.yml'
            compat:
              - 'data/drivers/vendors/**'
              - 'data/compat/**'
              - 'docs/content/hardware/compatibility.md'
              - 'scripts/gen-compat.ts'
            docs:
              - 'docs/**'
              - '.agents/**/*.md'
              - 'AGENTS.md'
              - 'crates/*/README.md'
              - 'data/drivers/vendors/**'
              - 'data/compat/**'
              - 'scripts/check-retired-api-docs.sh'
              - 'scripts/gen-compat.ts'
            workflow:
              - 'packaging/docker/**'
              - 'scripts/tests/docker-smoke.mjs'
              - 'scripts/tests/docker-workflow.test.mjs'
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/homebrew-formula.mjs'
              - 'scripts/with-macos-signing.sh'
              - 'scripts/resolve-release-version.sh'
              - 'scripts/tests/homebrew-formula.test.mjs'
              - 'scripts/tests/macos-ci-coverage.test.mjs'
              - 'scripts/tests/macos-release.test.mjs'
              - 'scripts/tests/release-workflow.test.mjs'
              - 'scripts/tests/resolve-release-version.test.mjs'
              - 'packaging/homebrew/**'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'udev/**'
              - '.github/workflows/ci.yml'

  # ── Workflow Lint ─────────────────────────────────────────────
  workflow-lint:
    name: Workflow Lint
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install compiler cache for lifecycle tests
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
          disable_annotations: "true"
      - name: Test build cache contracts
        run: node --test .github/actions/rust-build-cache/*.test.mjs
      - name: Test macOS job coverage
        run: node --test scripts/tests/macos-ci-coverage.test.mjs
      - name: Test Homebrew formula rendering
        run: node --test scripts/tests/homebrew-formula.test.mjs

      - name: Test release orchestration
        run: node --test scripts/tests/release-workflow.test.mjs scripts/tests/resolve-release-version.test.mjs scripts/tests/macos-release.test.mjs

      - name: Test Docker release contracts
        run: node --test scripts/tests/docker-workflow.test.mjs

      - name: Validate Docker Compose
        env:
          HYPERCOLOR_API_KEY: ci-compose-validation
          HOST_RENDER_GID: "109"
          HOST_VIDEO_GID: "44"
        run: |
          docker compose -f packaging/docker/compose.yaml config --quiet
          docker compose -f packaging/docker/compose.yaml -f packaging/docker/compose.gpu.yaml config --quiet

      - name: Actionlint
        # GitHub supports queue:max; actionlint's schema is pending upstream #654.
        # Docker contracts validate this sole queue key; every other error stays fatal.
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
          .github/workflows/*.yml

  # ── Rust Check (fmt + clippy) ──────────────────────────────────
  rust-check-shared:
    name: Rust Check / Shared
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-check-shared
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_RUST_DEPS }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-check-shared
          workspaces: . -> .cache/hypercolor/target/rust-check-shared
          cache-on-failure: "false"

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/hypercolor-ui/Cargo.toml --check

      - name: Check macOS GPU-only architecture
        run: ./scripts/check-macos-gpu-only.sh

      - name: Refuse new raw HTML sinks
        run: ./scripts/check-ui-html-sinks.sh

      - name: Test local build fabric
        run: |
          ./scripts/tests/cargo-cache-build-tests.sh
          ./scripts/tests/cargo-target-gc-tests.sh

      - name: Test release artifact contracts
        run: ./scripts/tests/release-artifact-tests.sh

      - name: Clippy shared crates
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo clippy --locked ${{ env.RUST_SHARED_WORKSPACE_ARGS }} --all-targets
          -- -D warnings

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  rust-check-macos:
    name: Rust macOS / ${{ matrix.label }} / ${{ matrix.lane }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            os: macos-26
            expected-arch: arm64
            lane: workspace
          - label: Apple Silicon
            os: macos-26
            expected-arch: arm64
            lane: capabilities
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-check-macos-${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v7

      - name: Qualify macOS runner and SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --show-sdk-version)"
          printf 'macOS SDK: %s\n' "${sdk_version}"
          test "$(uname -m)" = "${{ matrix.expected-arch }}"
          test "${sdk_version%%.*}" = "26"

      - name: Verify macOS signing secret transport
        run: ./scripts/tests/macos-signing-secret-transport-tests.sh

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-check-macos-${{ matrix.expected-arch }}-${{ matrix.lane }}
          workspaces: . -> .cache/hypercolor/target/rust-check-macos-${{ matrix.lane }}
          cache-on-failure: "false"

      - name: Install nextest
        if: matrix.lane == 'capabilities'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Seed native app frontend fixture
        if: matrix.lane == 'workspace'
        run: |
          mkdir -p crates/hypercolor-ui/dist
          printf '<!doctype html><title>Hypercolor test fixture</title>' \
            > crates/hypercolor-ui/dist/index.html

      # All targets, so macOS-only tests, benches, and examples compile here;
      # no other lane builds them.
      - name: Check macOS workspace
        if: matrix.lane == 'workspace'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo check --workspace --all-targets --locked

      - name: Clippy macOS interop
        if: matrix.lane == 'capabilities'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo clippy --locked -p hypercolor-macos-gpu-interop --features screen-capture
          --all-targets
          -- -D warnings

      - name: Clippy macOS capture fixtures
        if: matrix.lane == 'capabilities'
        run: |
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-macos-capture --features capture-fixtures --all-targets \
            -- -D warnings
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-core --features macos-capture-fixtures \
            --lib --test macos_screen_capture_tests \
            -- -D warnings

      - name: Clippy macOS host input and ownership
        if: matrix.lane == 'capabilities'
        run: |
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-macos-input --all-targets \
            -- -D warnings
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-macos-owner --all-targets \
            -- -D warnings
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-macos-session --all-targets \
            -- -D warnings
          ./scripts/cargo-cache-build.sh \
            cargo clippy --locked \
            -p hypercolor-daemon --no-default-features \
            --bin hypercolor-daemon --test macos_owner_tests \
            -- -D warnings

      - name: Run macOS interop fixtures
        if: matrix.lane == 'capabilities'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo nextest run --locked -p hypercolor-macos-gpu-interop
          --features screen-capture

      - name: Run macOS capture fixtures
        if: matrix.lane == 'capabilities'
        run: |
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-macos-capture --features capture-fixtures
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked --no-tests=fail \
            -p hypercolor-core --features macos-capture-fixtures \
            --lib --test macos_screen_capture_tests \
            -E 'test(screen::macos) | binary(macos_screen_capture_tests)'

      - name: Run macOS host input and ownership fixtures
        if: matrix.lane == 'capabilities'
        run: |
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-macos-input \
            --test input_contract_tests \
            --test process_identity_tests
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-macos-owner \
            --test coordinator_tests
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-macos-session \
            --test process_memory_tests
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-core --features macos-native-fixtures \
            --test macos_host_input_tests
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-daemon --no-default-features \
            --test macos_owner_tests
          ./scripts/cargo-cache-build.sh \
            cargo nextest run --locked \
            -p hypercolor-daemon --no-default-features \
            --lib \
            -E 'test(/(launchd_managed_contenders_exit_zero_without_respawn|held_guard_applies_topology_policy_without_an_owner_record|malformed_diagnostics_never_override_held_guard_policy)/)'

      - name: Run macOS status API fixtures
        if: matrix.lane == 'capabilities'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo nextest run --locked
          -p hypercolor-daemon --no-default-features --features wgpu --lib
          -E 'test(/api::system::tests::(input_source_status|macos_)/)'

      - name: Build deployment and Sequoia availability fixtures
        if: matrix.lane == 'workspace'
        run: |
          ./scripts/cargo-cache-build.sh \
            cargo build --locked -p hypercolor --bin hypercolor
          ./scripts/cargo-cache-build.sh \
            cargo build --locked -p hypercolor-daemon --no-default-features \
            --features wgpu,screen-capture --bin hypercolor-daemon

      - name: Verify deployment target
        if: matrix.lane == 'workspace'
        run: |
          ./scripts/verify-macos-deployment-target.sh \
            "${CARGO_TARGET_DIR}/debug/hypercolor" \
            "${CARGO_TARGET_DIR}/debug/hypercolor-daemon"

      - name: Reject unguarded Tahoe symbols in the Sequoia artifact
        if: matrix.lane == 'workspace'
        run: |
          set -euo pipefail
          artifact="${CARGO_TARGET_DIR}/debug/hypercolor-daemon"
          tahoe_symbols='SCScreenshot(Configuration|Manager)|CG(Context(Get|Set)ContentToneMappingInfo|ImageGetContentAverageLightLevel)|kCG(PreferredDynamicRange|DynamicRange(Standard|Constrained|High)|ContentAverageLightLevel)'
          if xcrun nm -u "${artifact}" | grep -E "${tahoe_symbols}"; then
            echo "unguarded Tahoe-only symbol found in ${artifact}" >&2
            exit 1
          fi
          echo "Sequoia availability scan passed: Tahoe-only APIs are runtime-resolved"

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Generated Effects Artifact ────────────────────────────────
  generated-effects:
    name: Generated Effects
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-cache
        with:
          key: effects-${{ hashFiles('sdk/bun.lock') }}
      - name: Install SDK dependencies
        working-directory: sdk
        run: bun install --frozen-lockfile
      - name: Build generated effects
        working-directory: sdk
        run: bun run build:effects
      - name: Upload generated effects
        uses: actions/upload-artifact@v7
        with:
          name: generated-effects
          path: effects/hypercolor
          if-no-files-found: error

  # ── Rust Test ──────────────────────────────────────────────────
  rust-test:
    name: Rust Test / ${{ matrix.label }}
    needs: [changes, generated-effects]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: shared
            label: Shared
            shared_key: rust-test-shared
            target_dir: .cache/hypercolor/target/rust-test-shared
          - suite: native
            label: Native App
            shared_key: rust-test-native
            target_dir: .cache/hypercolor/target/rust-test-native
          - suite: daemon
            label: Daemon
            shared_key: rust-test-daemon
            target_dir: .cache/hypercolor/target/rust-test-daemon
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ matrix.suite == 'native' && env.LINUX_DEPS || env.LINUX_RUST_DEPS }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: ${{ matrix.shared_key }}
          workspaces: . -> ${{ matrix.target_dir }}
          cache-on-failure: "false"

      - name: Download generated effects
        if: matrix.suite == 'shared'
        uses: actions/download-artifact@v8
        with:
          name: generated-effects
          path: effects/hypercolor

      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Seed native app frontend fixture
        if: matrix.suite == 'native'
        run: |
          mkdir -p crates/hypercolor-ui/dist
          printf '<!doctype html><title>Hypercolor test fixture</title>' \
            > crates/hypercolor-ui/dist/index.html

      - name: Run shared crate tests
        if: matrix.suite == 'shared'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo nextest run --locked ${{ env.RUST_SHARED_WORKSPACE_ARGS }}

      - name: Run allocation contracts serially
        if: matrix.suite == 'shared'
        run: |
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-core --no-default-features --features allocation-contract-tests --test alloc_contract_tests --test media_input_allocation_tests --test screen_cpu_fanout_allocation_tests --test spatial_area_reuse_tests -- --test-threads=1
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-windows-input --test alloc_contract_tests -- --test-threads=1

      - name: Clippy allocation contract
        if: matrix.suite == 'shared'
        run: >-
          ./scripts/cargo-cache-build.sh cargo clippy --locked -p hypercolor-core
          --no-default-features --features allocation-contract-tests
          --test alloc_contract_tests --test media_input_allocation_tests
          --test screen_cpu_fanout_allocation_tests
          --test spatial_area_reuse_tests
          -- -D warnings

      - name: Run shared crate doc tests
        if: matrix.suite == 'shared'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --doc --locked ${{ env.RUST_SHARED_WORKSPACE_ARGS }}

      - name: Clippy native app crates
        if: matrix.suite == 'native'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo clippy --locked -p hypercolor-app --all-targets
          -- -D warnings

      - name: Run native app tests
        if: matrix.suite == 'native'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo nextest run --locked -p hypercolor-app

      - name: Run native app doc tests
        if: matrix.suite == 'native'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --doc --locked -p hypercolor-app

      - name: Seed effect cover fixture
        if: matrix.suite == 'daemon'
        run: |
          mkdir -p effects/screenshots/curated/rainbow
          printf 'RIFFtest-webp-fixture' > effects/screenshots/curated/rainbow/default.webp

      - name: Run daemon tests
        if: matrix.suite == 'daemon'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo nextest run --locked -p hypercolor-daemon --no-default-features
          --features builtin-drivers,persistence-test-hooks --test-threads=1

      - name: Run daemon doc tests
        if: matrix.suite == 'daemon'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --doc --locked -p hypercolor-daemon --no-default-features
          --features builtin-drivers

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # Bare core Servo and daemon-default Servo stay as separate commands so
  # feature unification cannot hide CPU fallback coverage. They share one job,
  # target, and cache because the daemon graph contains the core graph.
  rust-test-servo:
    name: Rust Servo + E2E Build
    needs: [changes, generated-effects]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/servo
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_RUST_DEPS }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: servo
          workspaces: . -> .cache/hypercolor/target/servo
          cache-directories: |
            .cache/hypercolor/mozbuild
            .cache/hypercolor/toolchain
            .cache/hypercolor/ccache
          cache-on-failure: "false"

      - name: Download generated effects
        uses: actions/download-artifact@v8
        with:
          name: generated-effects
          path: effects/hypercolor

      - name: Build Servo e2e binaries
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo build --locked -p hypercolor-daemon -p hypercolor

      - name: Clippy core with Servo
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo clippy --locked -p hypercolor-core --features servo --lib --tests
          -- -D warnings

      - name: Clippy daemon with Servo
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo clippy --locked -p hypercolor-daemon --lib --bin hypercolor-daemon --tests
          -- -D warnings

      - name: Run core Servo tests
        if: needs.changes.outputs.full == 'true'
        run: |
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-core --features servo --test effect_factory_tests
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-core --features servo --test builtin_effect_tests

      - name: Run Servo HTML loader registration tests
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --locked -p hypercolor-core --features servo
          --test html_loader_tests

      - name: Run core Servo doc tests
        if: needs.changes.outputs.full == 'true'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --doc --locked -p hypercolor-core --features servo

      - name: Run daemon Servo tests
        if: needs.changes.outputs.full == 'true'
        run: |
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-daemon --lib -- --test-threads=1
          ./scripts/cargo-cache-build.sh cargo test --locked -p hypercolor-daemon --bin hypercolor-daemon -- --test-threads=1

      - name: Run daemon Servo doc tests
        if: needs.changes.outputs.full == 'true'
        run: >-
          ./scripts/cargo-cache-build.sh
          cargo test --doc --locked -p hypercolor-daemon

      - name: Stage Servo e2e binaries
        run: |
          mkdir -p e2e-binaries
          install -m755 "${CARGO_TARGET_DIR}/debug/hypercolor-daemon" \
            e2e-binaries/hypercolor-daemon
          install -m755 "${CARGO_TARGET_DIR}/debug/hypercolor" \
            e2e-binaries/hypercolor

      - name: Upload Servo e2e binaries
        uses: actions/upload-artifact@v7
        with:
          name: e2e-binaries-servo
          path: e2e-binaries
          if-no-files-found: error
          retention-days: 1

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Rust Windows ───────────────────────────────────────────────
  # Every #[cfg(target_os = "windows")] assertion in the shared crates is only
  # a gate because this job exists. Windows previously ran in build-native-app
  # alone, which is tag-gated, so Windows-only code paths reached main without
  # ever having been compiled by CI.
  rust-windows:
    name: Rust Windows
    needs: [changes, generated-effects]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    # Sized for a cold run. The steps below sweep five feature sets, so
    # almost all of the wall time is rustc, not tests, and a cache miss puts
    # the whole sweep well past an hour. Warm runs sit at 55 to 90 minutes.
    # A lockfile-wide dependency refresh makes every step cold at once: after
    # the Servo 0.6 refresh, clippy took 12 minutes instead of 2, shared
    # tests 40 instead of 10, and the daemon integration step was still
    # compiling at 120, which also discarded the cache save that would have
    # warmed the next run.
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-windows
    steps:
      - uses: actions/checkout@v7

      - name: Test PowerShell cache modes
        run: ./scripts/tests/cargo-cache-mode-tests.ps1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-windows
          workspaces: . -> .cache/hypercolor/target/rust-windows
          # This target archive is the largest in the repository. Saving a
          # copy per main commit took most of a Windows run's cache time and
          # crowded other lanes out of the Actions budget, so main saves one
          # per lockfile set and R2 supplies the workspace crates changed since.
          archive-key: dependencies
          # Saving only on success is self-perpetuating here: no cache makes
          # the job slow enough to fail, and failing is what withholds the
          # cache. Seeding from failed runs is what breaks back out.
          cache-on-failure: "true"

      - name: Download generated effects
        uses: actions/download-artifact@v8
        with:
          name: generated-effects
          path: effects/hypercolor

      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      - name: Clippy shared crates
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo clippy --locked ${{ env.RUST_WINDOWS_WORKSPACE_ARGS }} --all-targets
          '--' -D warnings

      - name: Clippy Windows capture fixtures
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo clippy --locked -p hypercolor-core
          --features windows-capture-fixtures --all-targets '--' -D warnings

      - name: Run shared crate tests
        run: ./scripts/cargo-cache-build.ps1 cargo nextest run --locked ${{ env.RUST_WINDOWS_WORKSPACE_ARGS }}

      - name: Run Windows capture and host input fixtures
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo nextest run --locked --no-tests=fail -p hypercolor-core
          --features windows-capture-fixtures
          --lib --test windows_host_input_fixture_tests
          --test windows_capture_fixture_tests
          -E 'test(screen::windows) | binary(windows_host_input_fixture_tests)
          | binary(windows_capture_fixture_tests)'

      - name: Run allocation contracts serially
        shell: pwsh
        run: |
          ./scripts/cargo-cache-build.ps1 cargo test --locked -p hypercolor-core --no-default-features --features allocation-contract-tests --test alloc_contract_tests --test media_input_allocation_tests --test screen_cpu_fanout_allocation_tests --test spatial_area_reuse_tests '--' --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/cargo-cache-build.ps1 cargo test --locked -p hypercolor-windows-input --test alloc_contract_tests '--' --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Clippy allocation contract
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo clippy --locked -p hypercolor-core
          --no-default-features --features allocation-contract-tests
          --test alloc_contract_tests --test media_input_allocation_tests
          --test screen_cpu_fanout_allocation_tests
          --test spatial_area_reuse_tests
          '--' -D warnings

      - name: Seed effect cover fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force effects/screenshots/curated/rainbow | Out-Null
          [IO.File]::WriteAllBytes(
            "effects/screenshots/curated/rainbow/default.webp",
            [Text.Encoding]::ASCII.GetBytes("RIFFtest-webp-fixture")
          )

      - name: Run daemon input and capture integration tests
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo nextest run --locked -p hypercolor-daemon --no-default-features
          --features builtin-drivers,persistence-test-hooks --test-threads=1

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # SparkleFlinger's GPU tests skip themselves when no compatible adapter
  # exists, and no other lane has one, so none of them ran in CI. Hosted
  # Windows runners have no GPU either, but DX12 still compiles every
  # shader through FXC on the CPU for the WARP software adapter. That
  # compile is where 0.6.1 lost a minute of startup and every Windows
  # install timed out. Forcing the fallback adapter and requiring GPU tests
  # turns that path from a skip into a gate.
  rust-windows-gpu:
    name: Rust Windows GPU (DX12 WARP)
    needs: [changes, generated-effects]
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    # Sized like rust-windows for a cold run after a lockfile refresh, even
    # though this lane builds one feature set and no Servo.
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-windows-gpu
      HYPERCOLOR_REQUIRE_GPU_TESTS: "1"
      HYPERCOLOR_GPU_TEST_FALLBACK_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-windows-gpu
          workspaces: . -> .cache/hypercolor/target/rust-windows-gpu
          archive-key: dependencies
          cache-on-failure: "true"

      - name: Download generated effects
        uses: actions/download-artifact@v8
        with:
          name: generated-effects
          path: effects/hypercolor

      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-nextest

      # Alone in its own step so no other test's shader compiles compete
      # with the measurement for CPU.
      - name: Check SparkleFlinger pipeline warmup budget
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo nextest run --locked --no-tests=fail
          -p hypercolor-daemon --no-default-features --features wgpu --lib
          -E 'test(gpu_pipeline_warmup_fits_daemon_startup_budget)' --no-capture

      - name: Run SparkleFlinger GPU tests on WARP
        run: >-
          ./scripts/cargo-cache-build.ps1 cargo nextest run --locked --no-tests=fail --no-fail-fast
          -p hypercolor-daemon --no-default-features --features wgpu --lib
          -E 'test(sparkleflinger::gpu::)
          and not test(gpu_pipeline_warmup_fits_daemon_startup_budget)'

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Cargo Deny ─────────────────────────────────────────────────
  rust-deny:
    name: Cargo Deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: ""

  # ── Compatibility Matrix Drift ─────────────────────────────────
  # Fails if data/drivers/vendors/*.toml was edited without regenerating the
  # compatibility matrix (README compat block, Zola page, JSON, snippet).
  # Zero external deps; the generator uses only Bun's stdlib.
  compat:
    name: Compatibility Matrix
    needs: changes
    # `compat` is already forced true for tags and non-smoke dispatch, so it
    # covers release builds on its own. Adding `full` here only meant "every
    # push to main", which rebuilt this on docs-only merges.
    if: needs.changes.outputs.compat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify compatibility matrix is current
        run: bun scripts/gen-compat.ts --check

  # ── Nix Flake ───────────────────────────────────────────────────
  nix:
    name: Nix Flake
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake formatting
        run: nix run nixpkgs#nixfmt-tree -- --ci
      - name: Build package and evaluate the NixOS module
        run: nix flake check --print-build-logs
      - name: Smoke-test the built package
        run: |
          set -euo pipefail
          nix build .#hypercolor --print-build-logs
          ./result/bin/hypercolor --version
          ./result/bin/hypercolor-daemon --help >/dev/null
          test -f ./result/lib/udev/rules.d/99-hypercolor.rules
          test -f ./result/lib/udev/rules.d/70-hypercolor-input.rules
          test -f ./result/share/hypercolor/ui/index.html
          test -d ./result/share/hypercolor/effects/bundled

  # ── Python Client ────────────────────────────────────────────────
  python:
    name: Python Client
    needs: changes
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Verify WebSocket protocol constants
        run: uv run python scripts/generate_ws_protocol.py --check

      - name: Run tests
        run: uv run pytest

  # ── Python Generated Client Drift ──────────────────────────────
  python-generated:
    name: Python Generated Client
    needs: [changes, rust-check-shared]
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
      needs.changes.outputs.python_generated == 'true' ||
      needs.changes.outputs.rust == 'true') &&
      (needs.rust-check-shared.result == 'success' ||
      needs.rust-check-shared.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    defaults:
      run:
        working-directory: python
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-test-daemon
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_RUST_DEPS }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-test-daemon
          workspaces: . -> .cache/hypercolor/target/rust-test-daemon
          save-if: "false"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify generated client is current
        run: uv run python scripts/generate_openapi_client.py --check

      - name: Verify WebSocket protocol manifest is current
        working-directory: .
        run: >-
          ./scripts/cargo-cache-build.sh cargo run --locked -q
          -p hypercolor-daemon --no-default-features
          --bin hypercolor-ws-manifest -- --check

      - name: Verify generated WebSocket constants are current
        run: uv run python scripts/generate_ws_protocol.py --check

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Python Package ───────────────────────────────────────────────
  python-build:
    name: Python Package
    needs: [python, python-generated]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: actions/setup-python@v7
        with:
          python-version-file: python/.python-version

      - name: Verify package version matches the tag
        run: |
          # The atomic release commit stamps pyproject.toml; a mismatch
          # means this tag was not cut through release.yml.
          version="${GITHUB_REF_NAME#v}"
          grep -Fx "version = \"${version}\"" pyproject.toml || {
            echo "pyproject.toml version does not match tag ${GITHUB_REF_NAME}" >&2
            grep '^version = ' pyproject.toml >&2
            exit 1
          }

      - name: Build package
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

  # ── SDK (TypeScript / Bun) ─────────────────────────────────────
  sdk:
    name: SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-cache
        with:
          key: sdk-${{ hashFiles('sdk/bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run build:effects

  # ── UI (Leptos / Trunk) ────────────────────────────────────────
  ui:
    name: UI
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    defaults:
      run:
        working-directory: crates/hypercolor-ui
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-cache
        with:
          key: ui-${{ hashFiles('crates/hypercolor-ui/bun.lock') }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          key: ui
      - run: bun install --frozen-lockfile
      - run: ../../scripts/cargo-cache-build.sh cargo test --locked
      - name: Install Trunk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: trunk@0.21.14
      - run: env -u NO_COLOR RUSTC_WRAPPER=sccache trunk build --release

      - name: Upload e2e UI build
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ui-dist
          path: crates/hypercolor-ui/dist
          if-no-files-found: error
          retention-days: 1

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── End-to-End (Playwright) ──────────────────────────────────
  e2e-build-cpu:
    name: E2E Build / CPU Smoke
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    timeout-minutes: 75
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/hypercolor/target/rust-test-daemon
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_RUST_DEPS }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          shared-key: rust-test-daemon
          workspaces: . -> .cache/hypercolor/target/rust-test-daemon
          save-if: "false"

      - name: Build CPU e2e binaries
        run: |
          ./scripts/cargo-cache-build.sh cargo build --locked -p hypercolor-daemon --no-default-features --features builtin-drivers
          ./scripts/cargo-cache-build.sh cargo build --locked -p hypercolor

      - name: Stage CPU e2e binaries
        run: |
          mkdir -p e2e-binaries
          install -m755 "${CARGO_TARGET_DIR}/debug/hypercolor-daemon" \
            e2e-binaries/hypercolor-daemon
          install -m755 "${CARGO_TARGET_DIR}/debug/hypercolor" \
            e2e-binaries/hypercolor

      - name: Upload CPU e2e binaries
        uses: actions/upload-artifact@v7
        with:
          name: e2e-binaries-cpu
          path: e2e-binaries
          if-no-files-found: error
          retention-days: 1

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  e2e-assemble:
    name: E2E Assemble / ${{ matrix.label }}
    needs: [rust-test-servo, e2e-build-cpu, generated-effects, ui]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: servo
            label: Servo
          - suite: cpu
            label: CPU Smoke
    steps:
      - name: Download e2e binaries
        uses: actions/download-artifact@v8
        with:
          name: e2e-binaries-${{ matrix.suite }}
          path: e2e-stack/bin

      - name: Download generated effects
        uses: actions/download-artifact@v8
        with:
          name: generated-effects
          path: e2e-stack/effects

      - name: Download UI build
        uses: actions/download-artifact@v8
        with:
          name: e2e-ui-dist
          path: e2e-stack/ui

      - name: Upload e2e stack
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stack-${{ matrix.suite }}
          path: e2e-stack
          if-no-files-found: error
          retention-days: 1

  docker-e2e:
    name: Docker / Headless HTML and WLED
    needs: e2e-assemble
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Servo e2e stack
        uses: actions/download-artifact@v8
        with:
          name: e2e-stack-servo
          path: e2e-stack

      - name: Stage Docker runtime payload
        run: |
          mkdir -p docker-context/bin docker-context/share/hypercolor/effects/bundled docker-context/share/hypercolor/ui
          install -m755 e2e-stack/bin/hypercolor-daemon docker-context/bin/hypercolor-daemon
          install -m755 e2e-stack/bin/hypercolor docker-context/bin/hypercolor
          cp -R e2e-stack/effects/. docker-context/share/hypercolor/effects/bundled/
          cp -R e2e-stack/ui/. docker-context/share/hypercolor/ui/

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker-context
          file: packaging/docker/Dockerfile
          load: true
          tags: hypercolor-container:proof
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}

      - name: Prove container rendering, WLED output, and persistence
        run: node scripts/tests/docker-smoke.mjs hypercolor-container:proof

  e2e:
    name: E2E / ${{ matrix.label }}
    needs: [rust-check-shared, e2e-assemble]
    if: >-
      always() &&
      (needs.rust-check-shared.result == 'success' ||
      needs.rust-check-shared.result == 'skipped') &&
      needs.e2e-assemble.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: servo
            label: Servo
          - suite: cpu
            label: CPU Smoke
    env:
      HYPERCOLOR_E2E_KEEP_RUN_DIR: "1"
      HYPERCOLOR_E2E_DAEMON_BIN: ${{ github.workspace }}/e2e-stack/bin/hypercolor-daemon
      HYPERCOLOR_E2E_CLI_BIN: ${{ github.workspace }}/e2e-stack/bin/hypercolor
      HYPERCOLOR_E2E_UI_DIST_DIR: ${{ github.workspace }}/crates/hypercolor-ui/dist
      HYPERCOLOR_E2E_STACK: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7

      - name: Download e2e stack
        uses: actions/download-artifact@v8
        with:
          name: e2e-stack-${{ matrix.suite }}
          path: e2e-stack

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_RUST_DEPS }}

      - uses: actions/setup-node@v7
        with:
          # Node 24.16+ hangs `playwright install` in extract-zip
          # (microsoft/playwright#41000, fixed in Playwright 1.60); stay on
          # 22 LTS until the e2e Playwright dependency is bumped past 1.60.
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Restore e2e stack
        run: |
          chmod +x e2e-stack/bin/hypercolor-daemon e2e-stack/bin/hypercolor
          rm -rf crates/hypercolor-ui/dist effects/hypercolor
          mkdir -p crates/hypercolor-ui/dist effects/hypercolor
          cp -R e2e-stack/ui/. crates/hypercolor-ui/dist/
          cp -R e2e-stack/effects/. effects/hypercolor/

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: e2e
        run: npm test

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/hypercolor-e2e-*

  # ── Docs (Zola → GitHub Pages) ─────────────────────────────────
  docs-build:
    name: Docs Build
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.docs == 'true') ||
      (github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.changes.outputs.docs == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_docs)
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.23.3"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin

      - name: Build site
        working-directory: docs
        run: zola build

      - name: Check retired API guidance
        run: ./scripts/check-retired-api-docs.sh

      - name: Upload Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (
            (github.event_name == 'push' && needs.changes.outputs.docs == 'true') ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy_docs)
          )
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  docs-deploy:
    name: Docs Deploy
    needs: [changes, docs-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.docs == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_docs)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # ── Web Assets (built once, shared across release platforms) ───
  web-assets:
    name: Web Assets
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.release_artifacts != 'none')
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-cache
        with:
          key: web-assets-${{ hashFiles('sdk/bun.lock', 'crates/hypercolor-ui/bun.lock') }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          key: web-assets

      - name: Install Trunk
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: trunk@0.21.14

      - name: Build UI
        working-directory: crates/hypercolor-ui
        run: |
          bun install --frozen-lockfile
          env -u NO_COLOR RUSTC_WRAPPER=sccache trunk build --release

      - name: Build effects
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bun run build:effects

      - name: Stage web assets
        run: |
          mkdir -p staging/ui staging/effects
          cp -R crates/hypercolor-ui/dist/. staging/ui/
          if [ -d effects/hypercolor ]; then
            cp -R effects/hypercolor/. staging/effects/
          fi

      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: staging/
          if-no-files-found: error

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Build Native App Installers ───────────────────────────────
  release-credentials:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify signing credentials before building release artifacts
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: bash scripts/with-macos-signing.sh true

  build-native-app:
    name: Native App (${{ matrix.target }})
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.release_artifacts == 'full')
    needs: [release-credentials, web-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact-kind: nsis
            cask_arch: ""
            artifact-path: |
              target/release/bundle/nsis/*.exe
              crates/hypercolor-app/target/release/bundle/nsis/*.exe
          # macOS builds stop at an unsigned app bundle. sign-macos signs,
          # notarizes, and packages it on a fresh runner with its own time
          # budget, so a slow Apple queue never costs a rebuild.
          - target: macos-arm64
            os: macos-26
            rust-target: aarch64-apple-darwin
            bundles: app
    runs-on: ${{ matrix.os }}
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    env:
      # Absolute on purpose. Cargo resolves a relative CARGO_TARGET_DIR
      # against the current directory, and the Tauri bundle step runs from
      # crates/hypercolor-app, so a bare "target" sent that build to its own
      # cold directory and rebuilt the third of its graph the sidecar build
      # shares (157 of ~475 crates). The rest is the app's own tree, which
      # nothing here compiles twice, so this saves work and not wall time.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7

      - name: Qualify macOS runner and SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --show-sdk-version)"
          printf 'macOS SDK: %s\n' "${sdk_version}"
          test "${sdk_version%%.*}" = "26"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-target }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          key: native-app-${{ matrix.target }}
          workspaces: . -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install Tauri CLI
        # tauri-cli publishes prebuilt binaries with binstall metadata — a
        # seconds-long download instead of a from-source build. Fall back
        # to compiling only if binary resolution ever breaks.
        #
        # --targets must be pinned: on Apple Silicon, binstall's Rosetta
        # fallback happily grabs the x86_64 cargo-tauri, and Tauri then
        # derives sidecar names for the wrong architecture ("resource path
        # hypercolor-daemon-x86_64-apple-darwin doesn't exist").
        #
        # The version is exact because crates/hypercolor-app/installer.nsi
        # forks the NSIS template of the tauri-bundler this CLI pins; keep it
        # in step with that file's header and build-windows-installer.ps1.
        run: cargo binstall -y --targets "${{ matrix.rust-target }}" "tauri-cli@=2.12.1" || cargo install tauri-cli --version "=2.12.1" --locked

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: web-assets/

      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = "Stop"
          function Get-CargoVersion {
            $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
            return ($metadata.packages | Where-Object { $_.name -eq "hypercolor-daemon" }).version
          }

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = $env:INPUT_RELEASE_VERSION -replace '^v', ''
            if ([string]::IsNullOrWhiteSpace($version)) {
              $version = "$(Get-CargoVersion)-ci.0"
            }
          }

          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid release version: $version"
          }

          $cargoVersion = Get-CargoVersion
          $baseVersion = ($version -split '-', 2)[0]
          if ($version -ne $cargoVersion -and $baseVersion -ne $cargoVersion) {
            throw "Release version $version does not match Cargo version $cargoVersion"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Patch app version from tag
        shell: pwsh
        run: |
          $configPath = "crates/hypercolor-app/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.version = "${{ steps.version.outputs.version }}"
          $config | ConvertTo-Json -Depth 100 | Set-Content -NoNewline $configPath

      - name: Build native sidecar binaries
        shell: pwsh
        run: |
          # A pwsh step only fails on the LAST command's exit code, so a
          # failed daemon build sails through if a later build succeeds —
          # check every invocation explicitly. Splatting needs a variable
          # (@rest); an inline @(...) collapses into a single argument.
          function Invoke-Checked {
            $cmd, $rest = $args
            & $cmd @rest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          if ($env:RUNNER_OS -eq "Windows") {
            Invoke-Checked ./scripts/cargo-cache-build.ps1 cargo build --release --locked -p hypercolor-daemon --features servo
            Invoke-Checked ./scripts/cargo-cache-build.ps1 cargo build --release --locked -p hypercolor
          } else {
            Invoke-Checked bash ./scripts/cargo-cache-build.sh cargo build --release --locked -p hypercolor-daemon --features servo
            Invoke-Checked bash ./scripts/cargo-cache-build.sh cargo build --release --locked -p hypercolor
          }
          if ($env:RUNNER_OS -eq "Windows") {
            Invoke-Checked ./scripts/cargo-cache-build.ps1 cargo build --release --locked -p hypercolor-windows-pawnio --bin hypercolor-smbus-service
            Invoke-Checked ./scripts/cargo-cache-build.ps1 cargo build --release --locked -p hypercolor-windows-helper --bin hypercolor-windows-helper
          }

      - name: Stage downloaded web assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Copy-Tree($Source, $Destination) {
            if (Test-Path -LiteralPath $Destination) {
              Remove-Item -LiteralPath $Destination -Recurse -Force
            }
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null

            if (Test-Path -LiteralPath $Source) {
              Get-ChildItem -LiteralPath $Source -Force |
                ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $Destination -Recurse -Force
                }
            }
          }

          Copy-Tree "web-assets/ui" "crates/hypercolor-ui/dist"
          Copy-Tree "web-assets/effects" "effects/hypercolor"

      - name: Stage app bundle payload
        shell: pwsh
        run: ./scripts/stage-app-bundle-assets.ps1

      - name: Build Tauri native bundle
        if: runner.os == 'Windows'
        working-directory: crates/hypercolor-app
        shell: pwsh
        env:
          TAURI_BUNDLES: ${{ matrix.bundles }}
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          $configArgs = @()
          if (Test-Path "tauri.bundle.conf.json") {
            $configArgs += @("--config", "tauri.bundle.conf.json")
          }
          if ($env:RUNNER_OS -eq "Windows" -and (Test-Path "tauri.windows.bundle.conf.json")) {
            $configArgs += @("--config", "tauri.windows.bundle.conf.json")
          }
          $buildArgs = @("--ci", "--bundles", $env:TAURI_BUNDLES)
          $buildArgs += "--no-sign"
          # The cached target dir can carry installers from older builds;
          # only this build's installer may be verified and uploaded.
          $nsisDirs = @("../../target/release/bundle/nsis", "target/release/bundle/nsis")
          if ($env:CARGO_TARGET_DIR) { $nsisDirs += Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis" }
          $nsisDirs | Where-Object { Test-Path $_ } | ForEach-Object { Remove-Item -Recurse -Force $_ }
          cargo tauri build @buildArgs @configArgs

      - name: Verify installer DLL closure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @("target/release/bundle/nsis", "crates/hypercolor-app/target/release/bundle/nsis")
          if ($env:CARGO_TARGET_DIR) { $roots += Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis" }
          $installers = $roots | Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter "*-setup.exe" } | Sort-Object FullName -Unique
          if (-not $installers) { throw "no NSIS installer found under: $($roots -join ', ')" }
          foreach ($installer in $installers) {
            ./scripts/check-windows-dll-closure.ps1 -Installer $installer.FullName
          }

      - name: Verify in-place upgrade from the previous release
        # Installs the highest published release older than this build, then
        # upgrades it with this build's installer twice, once clicking
        # through the wizard and once with /S, checking that autostart,
        # shortcuts, and a clean UI tree survive each time.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $roots = @("target/release/bundle/nsis", "crates/hypercolor-app/target/release/bundle/nsis")
          if ($env:CARGO_TARGET_DIR) { $roots += Join-Path $env:CARGO_TARGET_DIR "release/bundle/nsis" }
          $candidate = $roots | Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem $_ -Filter "*_x64-setup.exe" } | Sort-Object FullName -Unique |
            Select-Object -First 1
          if (-not $candidate) { throw "no NSIS installer found under: $($roots -join ', ')" }
          if ($candidate.Name -notmatch '^Hypercolor_(.+)_x64-setup\.exe$') {
            throw "unexpected installer name: $($candidate.Name)"
          }
          $version = [semver]$Matches[1]
          $tags = @(gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 30 --json tagName --jq '.[].tagName')
          if ($LASTEXITCODE -ne 0) { throw "gh release list failed with exit code $LASTEXITCODE" }
          $releases = @($tags | ForEach-Object {
            $parsed = $null
            if ([semver]::TryParse($_.TrimStart('v'), [ref]$parsed)) {
              [pscustomobject]@{ Tag = $_; Version = $parsed }
            }
          })
          if ($tags.Count -gt 0 -and $releases.Count -eq 0) {
            throw "no published release tag parses as a version: $($tags -join ', ')"
          }
          # A smoke dispatch builds <version>-ci.0, which sorts below the
          # release it was cut from, so "older" has to mean semver-lower.
          $older = $releases | Where-Object { $_.Version -lt $version } |
            Sort-Object Version -Descending | Select-Object -First 1
          if (-not $older) {
            Write-Host "::notice::No published release is older than $version; skipping the upgrade check"
            exit 0
          }
          $previousDir = Join-Path $env:RUNNER_TEMP "previous-installer"
          gh release download $older.Tag --repo $env:GITHUB_REPOSITORY --pattern "*_x64-setup.exe" --dir $previousDir --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release download $($older.Tag) failed with exit code $LASTEXITCODE" }
          $previous = Get-ChildItem $previousDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $previous) { throw "$($older.Tag) has no *_x64-setup.exe asset" }
          foreach ($mode in "Interactive", "Silent") {
            ./scripts/test-windows-installer-upgrade.ps1 -PreviousInstaller $previous.FullName -CandidateInstaller $candidate.FullName -Mode $mode
          }

      - name: Build unsigned macOS app bundle
        if: runner.os == 'macOS'
        working-directory: crates/hypercolor-app
        run: >-
          cargo tauri build --ci --bundles app --no-sign
          --config tauri.bundle.conf.json --target '${{ matrix.rust-target }}'

      - name: Package unsigned macOS payload
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # One tar for the Apple silicon payload: the artifact store keeps
          # plain files, and the signing job needs the bundle's modes and
          # layout intact.
          # The sidecars use the host profile; Tauri builds the app with an
          # explicit target. Ship those exact binaries for dist.sh.
          payload="${RUNNER_TEMP}/unsigned-macos"
          rm -rf "${payload}"
          mkdir -p "${payload}/bin"
          install -m755 "${CARGO_TARGET_DIR}/release/hypercolor-daemon" "${payload}/bin/hypercolor-daemon"
          install -m755 "${CARGO_TARGET_DIR}/release/hypercolor" "${payload}/bin/hypercolor"
          install -m755 "${CARGO_TARGET_DIR}/${{ matrix.rust-target }}/release/hypercolor-app" "${payload}/bin/hypercolor-app"
          printf '%s\n' '${{ steps.version.outputs.version }}' > "${payload}/version"
          # macOS tar would otherwise archive extended attributes (as
          # AppleDouble entries and pax headers), codesign rejects bundle
          # detritus, and restoring kernel-protected com.apple.provenance
          # as a normal user can fail the unpack.
          export COPYFILE_DISABLE=1
          tar --no-xattrs -cf "${RUNNER_TEMP}/unsigned-${{ matrix.target }}.tar" \
            -C "${payload}" version bin \
            -C "${CARGO_TARGET_DIR}/${{ matrix.rust-target }}/release/bundle/macos" Hypercolor.app

      - name: Upload unsigned macOS payload
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 7

      - name: Upload native release bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: hypercolor-app-${{ steps.version.outputs.version }}-${{ matrix.target }}-${{ matrix.artifact-kind }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Sign macOS Release Artifacts ──────────────────────────────
  # Runs on a fresh runner from build-native-app's unsigned payload, so the
  # three notarizations get their own job budget and a failed or slow
  # notarization reruns without rebuilding the app. Apple silicon is the
  # only macOS target, and the leg runs on an Apple silicon runner because
  # dist.sh only generates shell completions when the host matches the
  # target.
  sign-macos:
    name: Sign macOS (${{ matrix.target }})
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.release_artifacts == 'full')
    needs: [build-native-app, release-credentials, web-assets]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-26
            rust-target: aarch64-apple-darwin
            artifact-kind: dmg
            cask_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Qualify macOS runner and SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --show-sdk-version)"
          printf 'macOS SDK: %s\n' "${sdk_version}"
          test "${sdk_version%%.*}" = "26"

      # dist.sh reads the host triple from rustc even when it packages
      # pre-built binaries.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-target }}

      - name: Download unsigned macOS payload
        uses: actions/download-artifact@v8
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ runner.temp }}/unsigned

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: web-assets/

      - name: Unpack unsigned macOS payload
        id: payload
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/unsigned-payload"
          rm -rf "${payload}"
          mkdir -p "${payload}"
          tar --no-xattrs -xpf "${RUNNER_TEMP}/unsigned/unsigned-${{ matrix.target }}.tar" -C "${payload}"
          version="$(cat "${payload}/version")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "unsigned payload carries an invalid version: ${version}" >&2
            exit 1
          fi
          # Restore the bundle where build-native-app's Tauri build left it,
          # so every later path matches a single-job build.
          bundle_dir="target/${{ matrix.rust-target }}/release/bundle/macos"
          mkdir -p "${bundle_dir}"
          mv "${payload}/Hypercolor.app" "${bundle_dir}/Hypercolor.app"
          {
            echo "version=${version}"
            echo "bin-dir=${payload}/bin"
          } >> "$GITHUB_OUTPUT"

      - name: Sign and notarize macOS app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # A stalled Apple queue fails with the submission status instead of
          # running into the job limit.
          NOTARY_WAIT_TIMEOUT: 60m
        run: |
          bash scripts/with-macos-signing.sh scripts/sign-macos-artifacts.sh sign-app \
            --app 'target/${{ matrix.rust-target }}/release/bundle/macos/Hypercolor.app' \
            --target '${{ matrix.rust-target }}' \
            --version '${{ steps.payload.outputs.version }}' \
            --arch '${{ matrix.cask_arch }}'

      - name: Verify signed macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          profile_dir="target/${{ matrix.rust-target }}/release"
          app="${profile_dir}/bundle/macos/Hypercolor.app"
          ./scripts/verify-macos-deployment-target.sh "${app}"
          dmg="${profile_dir}/bundle/dmg/Hypercolor-${{ steps.payload.outputs.version }}-${{ matrix.cask_arch }}.dmg"
          ./scripts/sign-macos-artifacts.sh verify-app \
            --app "$app" --dmg "$dmg" --provenance "${dmg}.notarization.json" \
            --target '${{ matrix.rust-target }}' --team-id "$APPLE_TEAM_ID"

      - name: Assemble signed macOS distribution
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          # A stalled Apple queue fails with the submission status instead of
          # running into the job limit.
          NOTARY_WAIT_TIMEOUT: 60m
        run: |
          version='${{ steps.payload.outputs.version }}'
          bash scripts/with-macos-signing.sh scripts/dist.sh --ci --skip-docs \
            --web-assets web-assets --target '${{ matrix.rust-target }}' \
            --bin-dir '${{ steps.payload.outputs.bin-dir }}' --version "${version}"
          dist_name="hypercolor-${version}-macos-arm64"
          ./scripts/sign-macos-artifacts.sh verify-standalone \
            --directory "dist/${dist_name}" \
            --target '${{ matrix.rust-target }}' --team-id "$APPLE_TEAM_ID"
          (cd dist && shasum -a 256 "${dist_name}.tar.gz" > "${dist_name}.tar.gz.sha256")

      - name: Upload macOS release tarball
        uses: actions/upload-artifact@v7
        with:
          name: hypercolor-tarball-${{ steps.payload.outputs.version }}-${{ matrix.target }}
          path: |
            dist/hypercolor-*.tar.gz
            dist/hypercolor-*.tar.gz.sha256
          if-no-files-found: error
          # A rerun after a partial upload replaces rather than conflicts.
          overwrite: true

      - name: Upload native release bundle
        uses: actions/upload-artifact@v7
        with:
          name: hypercolor-app-${{ steps.payload.outputs.version }}-${{ matrix.target }}-${{ matrix.artifact-kind }}
          path: target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg*
          if-no-files-found: error
          overwrite: true

  # ── Build Release Tarballs ────────────────────────────────────
  build-release-smoke:
    name: Release Tarball Smoke (linux-amd64)
    if: github.event_name == 'workflow_dispatch' && inputs.release_artifacts == 'smoke'
    needs: web-assets
    runs-on: ubuntu-latest
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_DEPS }} librsvg2-bin

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          key: release-smoke-linux-amd64

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: web-assets/

      - name: Determine version
        id: version
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="$(./scripts/resolve-release-version.sh "${INPUT_RELEASE_VERSION}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_name=hypercolor-${version}-linux-amd64" >> "$GITHUB_OUTPUT"

      - name: Assemble distribution
        run: |
          set -euo pipefail
          ./scripts/dist.sh --ci --skip-docs \
            --web-assets web-assets \
            --target linux-amd64 \
            --version "${{ steps.version.outputs.version }}"
          test -f "dist/${{ steps.version.outputs.dist_name }}.tar.gz"

      - name: Generate release checksum
        run: |
          set -euo pipefail
          dist_name="${{ steps.version.outputs.dist_name }}"
          tarball="${dist_name}.tar.gz"
          (
            cd dist
            sha256sum "${tarball}" > "${tarball}.sha256"
            cat "${tarball}.sha256"
          )

      - name: Verify release tarball
        run: |
          dist_name="${{ steps.version.outputs.dist_name }}"
          ./scripts/verify-release-artifact.sh \
            "dist/${dist_name}.tar.gz" \
            "dist/${dist_name}.tar.gz.sha256"

      - name: Build Debian package
        run: |
          dist_name="${{ steps.version.outputs.dist_name }}"
          ./scripts/package-deb.sh "dist/${dist_name}" dist

      - name: Verify Debian package
        run: |
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name 'hypercolor_*.deb' | sort)
          if [ "${#debs[@]}" -ne 1 ]; then
            printf 'expected exactly one Debian package, found %s\n' "${#debs[@]}" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          fi
          ./scripts/verify-deb-package.sh "${debs[0]}"

      - name: Stage verified Docker runtime payload
        run: |
          mkdir -p docker-context
          tar -xzf "dist/${{ steps.version.outputs.dist_name }}.tar.gz" \
            --strip-components=1 -C docker-context

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker-context
          file: packaging/docker/Dockerfile
          load: true
          tags: hypercolor-container:linux-amd64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Prove container rendering, WLED output, and persistence
        run: node scripts/tests/docker-smoke.mjs hypercolor-container:linux-amd64

      - name: Export tested Docker image
        run: docker image save --output hypercolor-container-linux-amd64.tar hypercolor-container:linux-amd64

      - name: Upload tested Docker image
        uses: actions/upload-artifact@v7
        with:
          name: container-linux-amd64
          path: hypercolor-container-linux-amd64.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload release tarball smoke
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.dist_name }}
          path: |
            dist/${{ steps.version.outputs.dist_name }}.tar.gz
            dist/${{ steps.version.outputs.dist_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Upload Debian package smoke
        uses: actions/upload-artifact@v7
        with:
          name: hypercolor-deb-${{ steps.version.outputs.version }}-linux-amd64
          path: dist/hypercolor_*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  build-release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
      inputs.release_artifacts == 'full')
    needs: [release-credentials, web-assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
          - target: linux-arm64
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
    # A full workflow_dispatch on the default branch warms these release
    # shapes. Tags restore that trusted cache; they never publish cache state.
    timeout-minutes: 120
    runs-on: ${{ matrix.os }}
    environment:
      # Only main may hold the read-write R2 key; every other run reads.
      name: ${{ github.ref == 'refs/heads/main' && 'sccache-writer' || '' }}
      deployment: false
    steps:
      - uses: actions/checkout@v7

      - name: Report runner capacity
        shell: bash
        run: |
          echo "cores: $(getconf _NPROCESSORS_ONLN)"
          if command -v free >/dev/null 2>&1; then free -h; fi
          df -h .

      # Fat LTO over the Servo stack peaks past the 15Gi these runners carry,
      # and an unresponsive VM gets torn down by the host rather than the
      # kernel killing one process, so the build dies with no error to read.
      # Disk is the resource sitting spare here, better than 100G of it, so
      # spend it: a link that pages is slow, a link that is killed never
      # finishes. Nothing about the produced binary changes.
      - name: Provision swap for the release link
        if: runner.os == 'Linux'
        run: |
          # Deliberately not set -e. Swap is a cushion, not a correctness
          # requirement, so a runner image that refuses one must still get
          # its build attempted rather than failing here.
          set -uo pipefail
          # A separate path from the image's own /swapfile, which is already
          # swapped on: allocating over a live swapfile fails with ETXTBSY,
          # and this way the image's 3Gi is added to rather than replaced.
          swapfile=/hypercolor-swap
          if ! sudo fallocate -l 32G "${swapfile}" 2>/dev/null; then
            sudo dd if=/dev/zero of="${swapfile}" bs=1M count=32768 status=none
          fi
          sudo chmod 600 "${swapfile}"
          sudo mkswap "${swapfile}" >/dev/null
          sudo swapon "${swapfile}" \
            || echo "warning: swap unavailable, link may exhaust memory"
          free -h

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --kill-after=30s "$APT_STEP_TIMEOUT" apt-get \
            -o Dpkg::Use-Pty=0 \
            -o Acquire::Retries="$APT_RETRIES" \
            -o Acquire::http::Timeout="$APT_HTTP_TIMEOUT" \
            -o Acquire::https::Timeout="$APT_HTTP_TIMEOUT" \
            install -y --no-install-recommends ${{ env.LINUX_DEPS }} librsvg2-bin

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-target }}

      - uses: ./.github/actions/rust-build-cache
        with:
          r2-access-key-id: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ vars.SCCACHE_R2_BUCKET }}
          r2-endpoint: ${{ vars.SCCACHE_R2_ENDPOINT }}
          key: release-${{ matrix.target }}

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: web-assets/

      - name: Determine version
        id: version
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          VERSION="$(./scripts/resolve-release-version.sh "${INPUT_RELEASE_VERSION}")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dist_name=hypercolor-${VERSION}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Assemble Linux distribution
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Exhausting memory takes the runner down rather than failing a
          # command, so nothing after this step survives to report it. Sample
          # while the build still has a process to sample from, and keep the
          # high-water mark where a truncated log still ends on it.
          if command -v free >/dev/null 2>&1; then
            (
              peak=0
              swap_peak=0
              while :; do
                read -r used avail <<<"$(free -m | awk '/^Mem:/ {print $3, $7}')"
                swap="$(free -m | awk '/^Swap:/ {print $3}')"
                [ "${used}" -gt "${peak}" ] && peak="${used}"
                [ "${swap}" -gt "${swap_peak}" ] && swap_peak="${swap}"
                printf '[mem] used=%sMi peak=%sMi avail=%sMi swap=%sMi swap_peak=%sMi\n' \
                  "${used}" "${peak}" "${avail}" "${swap}" "${swap_peak}"
                sleep 30
              done
            ) &
            sampler=$!
            trap 'kill "${sampler}" 2>/dev/null || true' EXIT
          fi
          ./scripts/dist.sh --ci --skip-docs \
            --web-assets web-assets \
            --target ${{ matrix.target }} \
            --version "${{ steps.version.outputs.version }}"
          test -f "dist/${{ steps.version.outputs.dist_name }}.tar.gz"

      # Memory exhaustion can take down the VM before this step runs.
      - name: Report runner capacity after failure
        if: failure()
        shell: bash
        run: |
          if command -v free >/dev/null 2>&1; then free -h; fi
          df -h .
          du -sh .cache/hypercolor/target 2>/dev/null || true

      - name: Generate release checksum
        run: |
          set -euo pipefail
          dist_name="${{ steps.version.outputs.dist_name }}"
          tarball="${dist_name}.tar.gz"
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${tarball}" > "${tarball}.sha256"
            else
              shasum -a 256 "${tarball}" > "${tarball}.sha256"
            fi
            cat "${tarball}.sha256"
          )

      - name: Verify Linux release tarball
        if: runner.os == 'Linux'
        run: |
          dist_name="${{ steps.version.outputs.dist_name }}"
          ./scripts/verify-release-artifact.sh \
            "dist/${dist_name}.tar.gz" \
            "dist/${dist_name}.tar.gz.sha256"

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          dist_name="${{ steps.version.outputs.dist_name }}"
          ./scripts/package-deb.sh "dist/${dist_name}" dist

      - name: Verify Debian package
        if: runner.os == 'Linux'
        run: |
          mapfile -t debs < <(find dist -maxdepth 1 -type f -name 'hypercolor_*.deb' | sort)
          if [ "${#debs[@]}" -ne 1 ]; then
            printf 'expected exactly one Debian package, found %s\n' "${#debs[@]}" >&2
            printf '%s\n' "${debs[@]}" >&2
            exit 1
          fi
          ./scripts/verify-deb-package.sh "${debs[0]}"

      - name: Stage verified Docker runtime payload
        run: |
          mkdir -p docker-context
          tar -xzf "dist/${{ steps.version.outputs.dist_name }}.tar.gz" \
            --strip-components=1 -C docker-context

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build Docker runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker-context
          file: packaging/docker/Dockerfile
          load: true
          tags: hypercolor-container:${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Prove container rendering, WLED output, and persistence
        run: node scripts/tests/docker-smoke.mjs hypercolor-container:${{ matrix.target }}

      - name: Export tested Docker image
        run: docker image save --output hypercolor-container-${{ matrix.target }}.tar hypercolor-container:${{ matrix.target }}

      - name: Upload tested Docker image
        uses: actions/upload-artifact@v7
        with:
          name: container-${{ matrix.target }}
          path: hypercolor-container-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload release tarball
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.dist_name }}
          path: |
            dist/${{ steps.version.outputs.dist_name }}.tar.gz
            dist/${{ steps.version.outputs.dist_name }}.tar.gz.sha256
          if-no-files-found: error

      - name: Upload Debian package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: hypercolor-deb-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/hypercolor_*.deb
          if-no-files-found: error

      - name: Save Rust build caches
        if: always()
        uses: ./.github/actions/rust-build-cache
        with:
          phase: save

  # ── Create GitHub Release ──────────────────────────────────────
  # Accepts workflow_dispatch as well as push: release.yml pushes tags
  # with GITHUB_TOKEN (which never fires `on: push`) and then dispatches
  # this workflow on the tag ref.
  # Compilation runs alongside validation; only publication waits for both.
  create-release:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/')
    needs: [build-release, build-native-app, release-credentials, rust-check-shared, rust-check-macos, rust-test, rust-test-servo, rust-windows, rust-windows-gpu, rust-deny, sdk, ui, e2e, web-assets, python, python-generated]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: hypercolor-*
          path: release-artifacts/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the end-user distributables. The native-app artifacts also
          # carry the raw .app bundle tree; an unfiltered find flattens its
          # hundreds of internal files into individual release assets.
          # macOS assets never publish here, even when sign-macos happened to
          # finish first: attach-macos owns them, so Apple's notarization
          # queue never delays the Linux and Windows release.
          mapfile -t files < <(find release-artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \
               -o -name '*.deb' -o -name '*-setup.exe' \) \
            ! -name '*-macos-*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          args=(
            "${GITHUB_REF_NAME}"
            --title "Hypercolor ${GITHUB_REF_NAME#v}"
            --verify-tag
          )
          # The release commit carries git-iris notes for this tag; fall
          # back to GitHub's generated notes if the file is missing.
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -s "${notes_file}" ]]; then
            args+=(--notes-file "${notes_file}")
          else
            args+=(--generate-notes)
          fi
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" "${files[@]}"

  # Publish the same native images that passed the container smoke test.
  publish-docker:
    name: Publish Docker image
    needs: [create-release, build-release]
    # All releases share the mutable latest tag. Queue publication, not builds.
    concurrency:
      group: hypercolor-docker-publication
      cancel-in-progress: false
      queue: max
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/') &&
      github.repository == 'hyperb1iss/hypercolor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested Docker images
        uses: actions/download-artifact@v8
        with:
          pattern: container-linux-*
          path: container-images
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested images and multiarch index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/hyperb1iss/hypercolor
          version="${GITHUB_REF_NAME#v}"
          sources=()
          for arch in amd64 arm64; do
            docker image load --input "container-images/hypercolor-container-linux-${arch}.tar"
            local_image="hypercolor-container:linux-${arch}"
            actual_arch="$(docker image inspect "${local_image}" --format '{{.Architecture}}')"
            if [[ "${actual_arch}" != "${arch}" ]]; then
              printf 'Docker image architecture %s does not match %s\n' "${actual_arch}" "${arch}" >&2
              exit 1
            fi
            remote_image="${image}:${version}-${arch}"
            docker image tag "${local_image}" "${remote_image}"
            docker image push "${remote_image}"
            sources+=("$(docker image inspect "${remote_image}" --format '{{index .RepoDigests 0}}')")
          done
          tags=(--tag "${image}:${version}")
          if [[ "${version}" != *-* ]]; then
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            if [[ "${latest_tag}" == "${GITHUB_REF_NAME}" ]]; then
              tags+=(--tag "${image}:latest")
            fi
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${image}:${version}"

  # ── Attach macOS Release Artifacts ─────────────────────────────
  # Apple notarization can hold a submission for hours, so the GitHub
  # Release and every other channel publish without waiting for it. Once
  # sign-macos succeeds, on the first attempt or on a later "Re-run failed
  # jobs" of the tag run, this attaches the signed tarballs and DMGs to the
  # same release and update-homebrew follows. Assets the release already
  # carries keep their published digests, so a rerun never clobbers them.
  attach-macos:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/')
    needs: [create-release, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: hypercolor-*-macos-*
          path: macos-artifacts/
          merge-multiple: true

      - name: Attach signed macOS artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Apple silicon is the only macOS target: one tarball, its
          # checksum, one DMG, and the DMG's notarization receipt.
          expected=(
            "hypercolor-${version}-macos-arm64.tar.gz"
            "hypercolor-${version}-macos-arm64.tar.gz.sha256"
            "Hypercolor-${version}-arm64.dmg"
            "Hypercolor-${version}-arm64.dmg.notarization.json"
          )
          mapfile -t files < <(find macos-artifacts -type f \
            \( -name 'hypercolor-*-macos-*.tar.gz' \
               -o -name 'hypercolor-*-macos-*.tar.gz.sha256' \
               -o -name '*.dmg' -o -name '*.dmg.notarization.json' \) | sort)
          found="$(for file in "${files[@]}"; do basename "${file}"; done | sort)"
          if [[ "${found}" != "$(printf '%s\n' "${expected[@]}" | sort)" ]]; then
            echo "expected exactly the signed Apple silicon macOS artifacts:" >&2
            printf '  %s\n' "${expected[@]}" >&2
            echo "found ${#files[@]}:" >&2
            printf '  %s\n' "${files[@]}" >&2
            exit 1
          fi
          existing="$(gh release view "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" \
            --json assets --jq '.assets[].name')"
          missing=()
          for file in "${files[@]}"; do
            name="$(basename "${file}")"
            if grep -qxF "${name}" <<<"${existing}"; then
              echo "keeping published ${name}"
            else
              missing+=("${file}")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Release ${GITHUB_REF_NAME} already carries every macOS artifact"
            exit 0
          fi
          echo "Attaching ${#missing[@]} macOS artifacts to ${GITHUB_REF_NAME}"
          gh release upload "${GITHUB_REF_NAME}" --repo "${REPOSITORY}" "${missing[@]}"

  # ── Publish npm Packages ───────────────────────────────────────
  # Uses npm trusted publishing (OIDC): no token, and provenance is
  # generated automatically. Both packages must have this repo +
  # workflow registered as a trusted publisher on npmjs.com.
  publish-npm:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/')
    needs: [sdk, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing / provenance
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: |
          set -euo pipefail
          # OIDC publish needs npm >= 11.5.1.
          npm install -g npm@latest
          npm --version

      - name: Install and build SDK
        working-directory: sdk
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          (cd packages/core && bun run build)

      - name: Publish packages
        working-directory: sdk
        run: |
          set -euo pipefail
          dist_tag="latest"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            dist_tag="next"
          fi
          for dir in packages/core packages/create-effect; do
            name="$(jq -r .name "${dir}/package.json")"
            version="$(jq -r .version "${dir}/package.json")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping"
              continue
            fi
            echo "Publishing ${name}@${version} (tag: ${dist_tag})"
            (cd "${dir}" && npm publish --access public --tag "${dist_tag}")
          done

  # ── Publish PyPI Package ───────────────────────────────────────
  # Requires a PyPI trusted publisher configured for this repo + workflow.
  publish-pypi:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    needs: [python-build, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ── Update AUR Package ────────────────────────────────────────
  update-aur:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for platform in linux-amd64 linux-arm64; do
            tarball="hypercolor-${VERSION}-${platform}.tar.gz"
            gh release download "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --pattern "${tarball}" \
              --dir release-artifacts
            sha=$(sha256sum "release-artifacts/${tarball}" | cut -d' ' -f1)
            echo "sha256_${platform//-/_}=${sha}" >> "$GITHUB_OUTPUT"
            echo "  ${platform}: ${sha}"
          done
      - name: Generate AUR package files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p aur
          sed \
            -e "s/pkgver=.*/pkgver=${VERSION}/" \
            -e "s/SHA256_LINUX_AMD64/${{ steps.checksums.outputs.sha256_linux_amd64 }}/g" \
            -e "s/SHA256_LINUX_ARM64/${{ steps.checksums.outputs.sha256_linux_arm64 }}/g" \
            packaging/aur/PKGBUILD > aur/PKGBUILD
          cp packaging/aur/hypercolor.install aur/hypercolor.install

          if grep -Eq "SKIP|SHA256_LINUX_" aur/PKGBUILD; then
            echo "Generated PKGBUILD still contains checksum placeholders" >&2
            exit 1
          fi
          grep -Eq "sha256sums_x86_64=\('[a-f0-9]{64}'\)" aur/PKGBUILD
          grep -Eq "sha256sums_aarch64=\('[a-f0-9]{64}'\)" aur/PKGBUILD

          echo "Generated AUR PKGBUILD:"
          cat aur/PKGBUILD

      - name: Generate AUR .SRCINFO
        run: |
          set -euo pipefail
          docker run --rm -v "${PWD}/aur:/pkg" archlinux:base-devel bash -lc '
            set -euo pipefail
            useradd -m builder
            chown -R builder:builder /pkg
            su builder -c "cd /pkg && makepkg --printsrcinfo > .SRCINFO"
          '

      - name: Upload AUR package files
        uses: actions/upload-artifact@v7
        with:
          name: aur-hypercolor-bin-${{ steps.version.outputs.version }}
          path: aur/
          include-hidden-files: true
          if-no-files-found: error

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_SSH_PRIVATE_KEY}" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not configured; artifact only."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/hypercolor-bin.git aur-remote
          cp aur/PKGBUILD aur/.SRCINFO aur/hypercolor.install aur-remote/
          cd aur-remote
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .SRCINFO PKGBUILD hypercolor.install
          git commit -m "hypercolor-bin: update to ${VERSION}" || exit 0
          git push

  update-homebrew:
    # Linux advances the tap on every stable release. macOS joins when the
    # signed lane attached its assets; otherwise the renderer carries the
    # published macOS stanza forward and leaves the cask alone, so a stalled
    # notarization never holds the Linux formula back.
    if: >-
      !cancelled() &&
      needs.create-release.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    needs: [create-release, attach-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test Homebrew formula rendering
        run: node --test scripts/tests/homebrew-formula.test.mjs

      - name: Download release tarballs and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          fetch() {
            gh release download "v${VERSION}" \
              --repo "${{ github.repository }}" --pattern "$1" --dir release-artifacts
            sha256sum "release-artifacts/$1" | cut -d' ' -f1
          }
          for platform in linux-amd64 linux-arm64; do
            sha=$(fetch "hypercolor-${VERSION}-${platform}.tar.gz")
            echo "sha256_${platform//-/_}=${sha}" >> "$GITHUB_OUTPUT"
            echo "  ${platform}: ${sha}"
          done
          # macOS ships for Apple silicon only, and only once notarized.
          macos_tarball="hypercolor-${VERSION}-macos-arm64.tar.gz"
          dmg="Hypercolor-${VERSION}-arm64.dmg"
          assets=$(gh release view "v${VERSION}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          has_tarball=false has_dmg=false
          grep -qxF "$macos_tarball" <<<"$assets" && has_tarball=true
          grep -qxF "$dmg" <<<"$assets" && has_dmg=true
          if [[ "$has_tarball" != "$has_dmg" ]]; then
            echo "::error::v${VERSION} carries only part of its macOS assets; the tap was not updated."
            exit 1
          fi
          if [[ "$has_tarball" == true ]]; then
            # Assign before echoing so a failed download stops the job
            # instead of falling through to carry mode.
            macos_sha=$(fetch "$macos_tarball")
            dmg_sha=$(fetch "$dmg")
            echo "sha256_macos_arm64=${macos_sha}" >> "$GITHUB_OUTPUT"
            echo "sha256_dmg_arm64=${dmg_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::v${VERSION} has no signed macOS build; macOS stays on the published formula."
          fi

      - name: Verify Homebrew tap token
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured; the tap was not updated."
            exit 1
          fi
          if ! can_push="$(gh api repos/hyperb1iss/homebrew-tap --jq '.permissions.push // false')"; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot authenticate; the tap was not updated."
            exit 1
          fi
          if [[ "$can_push" != "true" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN cannot push to hyperb1iss/homebrew-tap; the tap was not updated."
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: hyperb1iss/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          persist-credentials: true

      - name: Render formula and cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_LINUX_AMD64: ${{ steps.checksums.outputs.sha256_linux_amd64 }}
          SHA256_LINUX_ARM64: ${{ steps.checksums.outputs.sha256_linux_arm64 }}
          SHA256_MACOS_ARM64: ${{ steps.checksums.outputs.sha256_macos_arm64 }}
          SHA256_DMG_ARM64: ${{ steps.checksums.outputs.sha256_dmg_arm64 }}
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula homebrew-tap/Casks
          args=(--version "$VERSION"
            --linux-amd64 "$SHA256_LINUX_AMD64" --linux-arm64 "$SHA256_LINUX_ARM64"
            --template packaging/homebrew/hypercolor.rb
            --output homebrew-tap/Formula/hypercolor.rb)
          if [[ -n "$SHA256_MACOS_ARM64" ]]; then
            args+=(--macos-arm64 "$SHA256_MACOS_ARM64" --dmg-arm64 "$SHA256_DMG_ARM64"
              --cask-template packaging/homebrew/hypercolor-app.rb
              --cask-output homebrew-tap/Casks/hypercolor-app.rb)
          else
            # Read the published formula before the renderer overwrites it.
            cp homebrew-tap/Formula/hypercolor.rb "${RUNNER_TEMP}/published-hypercolor.rb"
            args+=(--carry-macos-from "${RUNNER_TEMP}/published-hypercolor.rb")
          fi
          node scripts/homebrew-formula.mjs "${args[@]}"
          echo "Rendered formula:"
          cat homebrew-tap/Formula/hypercolor.rb

      - name: Upload Homebrew formula
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-hypercolor-${{ steps.version.outputs.version }}
          path: |
            homebrew-tap/Formula/hypercolor.rb
            homebrew-tap/Casks/hypercolor-app.rb
          if-no-files-found: error
          # Re-running sign-macos re-runs this job in the same run, where a
          # carry-mode attempt already uploaded this name.
          overwrite: true

      - name: Push to homebrew-tap
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256_MACOS_ARM64: ${{ steps.checksums.outputs.sha256_macos_arm64 }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/hypercolor.rb Casks/hypercolor-app.rb
          if git diff --cached --quiet; then
            echo "Homebrew packages already match v${VERSION}"
            exit 0
          fi
          body="Update formula and cask from the published release checksums."
          if [[ -z "$SHA256_MACOS_ARM64" ]]; then
            body="Linux moves to ${VERSION}; macOS and the cask stay as published until a notarized build ships."
          fi
          git commit -m "hypercolor: update to ${VERSION}" -m "$body"
          git push

  # ── Update Nix Release Pin ───────────────────────────────────────
  # Mirrors update-aur: the flake wraps the published tarballs, so the
  # version and checksums in nix/release.json move after every stable
  # release. Lands as a pull request so main keeps the review gate. GitHub
  # never runs pull_request workflows for PRs opened with GITHUB_TOKEN, so
  # the job builds the flake against the new pin itself before opening it.
  update-nix:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref_name, '-')
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          for platform in linux-amd64 linux-arm64; do
            tarball="hypercolor-${VERSION}-${platform}.tar.gz"
            gh release download "v${VERSION}" \
              --repo "${{ github.repository }}" \
              --pattern "${tarball}" \
              --dir release-artifacts
            sha=$(sha256sum "release-artifacts/${tarball}" | cut -d' ' -f1)
            echo "sha256_${platform//-/_}=${sha}" >> "$GITHUB_OUTPUT"
            echo "  ${platform}: ${sha}"
          done

      - name: Write nix/release.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_AMD64: ${{ steps.checksums.outputs.sha256_linux_amd64 }}
          SHA_ARM64: ${{ steps.checksums.outputs.sha256_linux_arm64 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg amd64 "$SHA_AMD64" \
            --arg arm64 "$SHA_ARM64" \
            '{version: $version, sha256: {"x86_64-linux": $amd64, "aarch64-linux": $arm64}}' \
            > nix/release.json
          cat nix/release.json

      - name: Check whether the pin moved
        id: pin
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already points at ${VERSION}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.pin.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the flake against the new pin
        if: steps.pin.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          nix flake check --print-build-logs
          nix build .#hypercolor --print-build-logs
          ./result/bin/hypercolor --version | grep -F "${VERSION}"

      - name: Open pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          branch="ci/nix-release-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add nix/release.json
          git commit -F - <<EOF
          chore(nix): pin flake to release ${VERSION}

          Automated after the v${VERSION} tarballs were published. The flake
          wraps those artifacts, so the version and per-architecture
          checksums in nix/release.json follow every stable release.
          EOF
          # The branch is bot-owned, so a rerun of the tag lane replaces it.
          git push --force origin "${branch}"
          existing="$(gh pr list --head "${branch}" --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "Pull request already open for ${branch}; the force-push refreshed it."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(nix): pin flake to release ${VERSION}" \
            --body "Automated pin of the Nix flake to the v${VERSION} release tarballs. Checksums come straight from the published GitHub Release assets."
