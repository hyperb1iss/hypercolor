name: Device support request
description: Request lighting or display support for a device.
title: "[device] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which product you have and what you want Hypercolor to control.
        Put the product's brand and model in the issue title.
        A device appearing in Unclaimed hardware does not mean it has controllable lighting.
        If it has no lighting or display, you do not need to request support for it.
        You can submit a request without technical captures or knowing its protocol.

        Check the [compatibility matrix](https://github.com/hyperb1iss/hypercolor/blob/main/docs/content/hardware/compatibility.md)
        and [existing requests](https://github.com/hyperb1iss/hypercolor/issues?q=is%3Aissue+%22%5Bdevice%5D%22+in%3Atitle)
        first. If your device is listed as supported but is not working, use the bug report form.

  - type: textarea
    id: product
    attributes:
      label: Product brand and model
      description: |
        Use the name on the product, packaging, or receipt. Include a product link if you have one.
        If you cannot identify it, say unknown and share what you can, such as a photo of the device or label (cover any serial number).
        Names such as "USB Keyboard" or "VID 1A2C" do not identify the retail product.
      placeholder: "Brand and model, plus a product link or photo"
    validations:
      required: true

  - type: textarea
    id: lighting
    attributes:
      label: What would you like Hypercolor to control?
      description: |
        Describe the lighting or display on the device and what you want it to do.
        For example, keyboard backlighting, a fan ring, or a built-in screen.
        If you are unsure what can be controlled, describe what you can see.
      placeholder: "The keys light up, and I want to change their colors from Hypercolor."
    validations:
      required: true

  - type: dropdown
    id: lighting-control
    attributes:
      label: How do you control it today?
      options:
        - "An app can change the lighting or display"
        - "Only buttons or keyboard shortcuts on the device"
        - "The lights are fixed; I cannot change them"
        - "It has no lighting or display"
        - "I am not sure"
    validations:
      required: true

  - type: textarea
    id: control-software
    attributes:
      label: Software that controls the device
      description: |
        If an app works, give its name and what it can change. A link or screenshot helps.
        This can be the manufacturer's app, OpenRGB, SignalRGB, or another tool.
        Leave blank if you do not know of any.

  - type: dropdown
    id: platform
    attributes:
      label: OS you're on
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hypercolor version
      description: "Find the running daemon version in Settings > About or run `hypercolor status`. Enter unknown if you cannot check."
      placeholder: "Version shown in Settings > About"
    validations:
      required: true

  - type: input
    id: vid-pid
    attributes:
      label: USB IDs or connection type
      description: |
        Keep any prefilled USB VID:PID. Otherwise, include it if known, or describe the connection
        (USB, Wi-Fi, Ethernet, serial, or a controller port). Leave blank if unsure.
      placeholder: "1532:029D, Wi-Fi, or connected to a fan controller"

  - type: textarea
    id: detected-device
    attributes:
      label: Detected device details
      description: |
        Hypercolor may fill this from your computer's device inventory. These details help match
        the hardware; they do not confirm its retail model or that its lighting is controllable.
        Keep any prefilled details. You can leave this blank when opening a request directly.

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Optional. In the desktop app, choose Export Diagnostics from the tray menu.
        The zip is normally saved to your Desktop. Review its contents before attaching it
        to this public issue. On Windows, it includes driver ownership and other RGB software.
        Without the desktop app, you can paste the output of `hypercolor diagnose` instead.

  - type: textarea
    id: protocol-notes
    attributes:
      label: Protocol notes or captures (optional)
      description: |
        If you already have USB captures or protocol research, attach or link them here.
        You do not need to make captures to open this request.

  - type: dropdown
    id: willing-to-test
    attributes:
      label: Can you test a driver on this device?
      options:
        - "Yes, I can run patched builds and capture logs"
        - "Sometimes, when I have time"
        - "No, I'm just flagging the request"
        - "I am not sure; I would need instructions"
    validations:
      required: true

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Before submitting
      options:
        - label: I checked the compatibility matrix and existing requests for this product
          required: true
