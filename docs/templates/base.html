<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="theme-color" content="#e135ff">
  <meta name="author" content="{{ config.extra.author }}">

  <!-- Icons — the same trinity mark the desktop app uses for its own set -->
  <link rel="icon" href="{{ get_url(path='favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ get_url(path='img/brand/mark-64.png') }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ get_url(path='img/brand/icon-512.png') }}">
  <link rel="apple-touch-icon" href="{{ get_url(path='img/brand/apple-touch-icon.png') }}">

  <!-- Open Graph. get_url resolves against base_url, so the image is absolute
       as the spec requires. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}">
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}">
  <meta property="og:url" content="{{ config.base_url }}{% block og_path %}/{% endblock og_path %}">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta property="og:image" content="{{ get_url(path='img/brand/lockup-horizontal-480.png') }}">
  <meta property="og:image:width" content="1902">
  <meta property="og:image:height" content="480">
  <meta property="og:image:alt" content="Hypercolor">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}{{ config.title }}{% endblock twitter_title %}">
  <meta name="twitter:description" content="{% block twitter_description %}{{ config.description }}{% endblock twitter_description %}">
  <meta name="twitter:image" content="{{ get_url(path='img/brand/lockup-horizontal-480.png') }}">
  <meta name="twitter:image:alt" content="Hypercolor">

  <!-- Fonts — Satoshi + JetBrains Mono via Bunny (the app's exact source) -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=satoshi:400,500,600,700|jetbrains-mono:400,500,600,400i" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ get_url(path='silkcircuit.css') }}">

  <!-- Syntax tokens. Both themes define the same unscoped .z-* classes, so the
       active one is swapped by href rather than layered; theme-toggle.js owns
       the swap and the default here matches the <html data-theme> default. -->
  <link
    id="syntax-theme"
    rel="stylesheet"
    href="{{ get_url(path='giallo-dark.css') }}"
    data-dark="{{ get_url(path='giallo-dark.css') }}"
    data-light="{{ get_url(path='giallo-light.css') }}"
  >

  {% block head_extra %}{% endblock head_extra %}
</head>
<body data-search-index="{{ get_url(path='search_index.en.js') }}" data-search-lib="{{ get_url(path='elasticlunr.min.js') }}">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  {% include "partials/nav.html" %}

  <div class="site-overlay" id="site-overlay" aria-hidden="true"></div>

  {% block content %}{% endblock content %}

  {% include "partials/footer.html" %}
  {% include "partials/search.html" %}

  <script defer src="{{ get_url(path='js/theme-toggle.js') }}"></script>
  <script defer src="{{ get_url(path='js/search.js') }}"></script>
  <script defer src="{{ get_url(path='js/mermaid-loader.js') }}"></script>
  <script defer src="{{ get_url(path='js/toc-highlight.js') }}"></script>
  <script defer src="{{ get_url(path='js/sidebar.js') }}"></script>

  {% block body_extra %}{% endblock body_extra %}
</body>
</html>
