title = "Hypercolor"
description = "Open-source RGB lighting orchestration engine for Linux, Windows, and macOS"
base_url = "https://hyperb1iss.github.io/hypercolor"
compile_sass = true
build_search_index = true
generate_feeds = false
minify_html = true

[search]
include_title = true
include_description = true
include_path = true
include_content = true

# evga.com serves 503 to non-browser user agents and lian-li.com drops
# non-browser connections outright, so `zola check` cannot verify either
# even though both work in a browser.
#
# Internal links are ours and rot when pages move, so they fail the check.
# External ones answer differently to a checker than to a browser (github.com
# and tauri.app both report broken here while curl fetches them fine), so they
# report without failing the run: an unusable check gets run by nobody.
[link_checker]
skip_prefixes = ["https://www.evga.com", "https://lian-li.com"]
internal_level = "error"
external_level = "warn"

[markdown]
smart_punctuation = true
insert_anchor_links = "left"
bottom_footnotes = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "one-dark-pro"

[extra]
github_url = "https://github.com/hyperb1iss/hypercolor"
license = "Apache-2.0"
author = "Hyperbliss Technologies"

# Top navigation: the 11 doc front doors, in order. Plain url paths (not
# @/…_index.md colocation lookups) so the build never trips on a section that
# is still being authored (e.g. agents/). `prefix` drives the active-link
# highlight via current_path matching.
[[extra.menu]]
name = "Home"
url = "/"
prefix = "$home"

[[extra.menu]]
name = "Guide"
url = "/guide/"
prefix = "/guide/"

[[extra.menu]]
name = "Studio"
